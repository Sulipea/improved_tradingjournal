<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MNQ Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
/* ─── RESET ─────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}

/* ─── TOKENS ─────────────────────────────────────────────── */
:root{
  --ink0:#06080b;
  --ink1:#0c0f14;
  --ink2:#111520;
  --ink3:#171c28;
  --ink4:#1d2333;
  --ink5:#242b3d;
  --ink6:#2c3447;

  --border0:rgba(255,255,255,0.04);
  --border1:rgba(255,255,255,0.08);
  --border2:rgba(255,255,255,0.13);
  --border3:rgba(255,255,255,0.20);

  --cr:#d42b2b;
  --cr2:#ff3d3d;
  --cr3:#ff6b6b;
  --cr-a:rgba(212,43,43,0.07);
  --cr-b:rgba(212,43,43,0.14);
  --cr-c:rgba(212,43,43,0.25);
  --cr-d:rgba(212,43,43,0.40);

  --cg:#18a85c;
  --cg2:#22cc72;
  --cg-a:rgba(24,168,92,0.07);
  --cg-b:rgba(24,168,92,0.14);
  --cg-c:rgba(24,168,92,0.25);
  --cg-d:rgba(24,168,92,0.40);

  --cy:#c49a0f;
  --cy2:#e8b820;
  --cy-a:rgba(196,154,15,0.07);
  --cy-b:rgba(196,154,15,0.14);
  --cy-c:rgba(196,154,15,0.25);
  --cy-d:rgba(196,154,15,0.40);

  --cp:#8b6ef5;
  --cp2:#a78bfa;
  --cp-a:rgba(139,110,245,0.10);
  --cp-b:rgba(139,110,245,0.20);
  --cp-d:rgba(139,110,245,0.40);

  --t0:#eef1f8;
  --t1:#8a93a8;
  --t2:#3f4a5e;

  --f-sans:'Outfit',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',monospace;

  --r3:4px;--r5:6px;--r8:8px;--r10:10px;--r14:14px;--r20:20px;--r99:999px;

  --sw:214px;
  --ease:cubic-bezier(.35,0,.2,1);
  --spring:cubic-bezier(.34,1.4,.64,1);
}

/* ─── BASE ───────────────────────────────────────────────── */
body{
  font-family:var(--f-sans);
  background:var(--ink0);
  color:var(--t0);
  font-size:14px;
  line-height:1.5;
  display:flex;
  height:100vh;
}

/* ═══════════════════════════════════════════════════════════
   SIDEBAR
═══════════════════════════════════════════════════════════ */
.sidebar{
  width:var(--sw);min-width:var(--sw);
  height:100vh;
  background:var(--ink1);
  border-right:1px solid var(--border0);
  display:flex;flex-direction:column;
  flex-shrink:0;position:relative;z-index:30;
}
.sb-top{
  padding:18px 14px 14px;
  border-bottom:1px solid var(--border0);
}
.sb-logo{display:flex;align-items:center;gap:10px}
.sb-emblem{
  width:34px;height:34px;flex-shrink:0;
  border-radius:var(--r8);
  background:linear-gradient(145deg,#c02020,#7a0f0f);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;color:#fff;
  box-shadow:0 0 0 1px rgba(200,32,32,.4),0 4px 14px rgba(180,20,20,.35);
}
.sb-wordmark{line-height:1}
.sb-name{font-size:14.5px;font-weight:700;color:var(--t0);letter-spacing:-.02em}
.sb-tag{font-size:10px;color:var(--t2);font-family:var(--f-mono);letter-spacing:.05em;margin-top:1px}

.sb-nav{padding:8px 6px;flex:1;display:flex;flex-direction:column;gap:1px}
.nv{
  width:100%;display:flex;align-items:center;gap:9px;
  padding:9px 10px;border-radius:var(--r8);border:none;
  background:transparent;color:var(--t1);
  cursor:pointer;font-family:var(--f-sans);font-size:13.5px;font-weight:500;
  text-align:left;position:relative;
  transition:background .14s,color .14s;
}
.nv i{font-size:17px;flex-shrink:0;color:var(--t2);transition:color .14s}
.nv:hover{background:var(--ink3);color:var(--t0)}
.nv:hover i{color:var(--t1)}
.nv.on{background:var(--cr-a);color:var(--cr2);border:1px solid var(--cr-d)}
.nv.on i{color:var(--cr2)}
.nv.on::before{
  content:'';position:absolute;left:-1px;top:22%;bottom:22%;
  width:2.5px;background:var(--cr2);border-radius:2px;
  box-shadow:0 0 8px var(--cr);
}
.nv-badge{
  margin-left:auto;background:var(--cr);color:#fff;
  font-size:10px;font-weight:700;padding:1px 6px;border-radius:var(--r99);
  line-height:1.6;box-shadow:0 0 8px var(--cr-c);
}
.sb-foot{padding:8px 6px;border-top:1px solid var(--border0)}
.mkt-row{
  display:flex;align-items:center;gap:9px;
  padding:9px 11px;background:var(--ink2);
  border-radius:var(--r8);border:1px solid var(--border1);
}
.mkt-dot{
  width:7px;height:7px;border-radius:50%;background:var(--cg2);
  box-shadow:0 0 0 2px var(--cg-b);
  animation:heartbeat 2s ease-in-out infinite;
}
@keyframes heartbeat{0%,100%{box-shadow:0 0 0 2px var(--cg-b)}50%{box-shadow:0 0 0 4px var(--cg-a)}}
.mkt-name{font-size:12px;font-weight:700;font-family:var(--f-mono);color:var(--t0);letter-spacing:.05em}
.mkt-status{font-size:10px;color:var(--cg2);font-family:var(--f-mono);margin-left:auto}

/* ═══════════════════════════════════════════════════════════
   MAIN
═══════════════════════════════════════════════════════════ */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{
  height:52px;background:var(--ink1);border-bottom:1px solid var(--border0);
  padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.pg-h{line-height:1}
.pg-title{font-size:14px;font-weight:700;color:var(--t0);letter-spacing:-.01em}
.pg-sub{font-size:10px;color:var(--t2);font-family:var(--f-mono);letter-spacing:.04em;margin-top:2px}
.tb-r{display:flex;align-items:center;gap:8px}
.content{flex:1;overflow-y:auto;padding:20px 22px;background:var(--ink0)}
.content::-webkit-scrollbar{width:3px}
.content::-webkit-scrollbar-thumb{background:var(--ink5);border-radius:3px}

/* ═══════════════════════════════════════════════════════════
   CARDS
═══════════════════════════════════════════════════════════ */
.card{
  background:var(--ink1);border:1px solid var(--border0);
  border-radius:var(--r14);overflow:hidden;margin-bottom:10px;
  animation:up .18s var(--ease) both;
}
@keyframes up{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.card-hd{
  padding:13px 17px;border-bottom:1px solid var(--border0);
  display:flex;align-items:center;justify-content:space-between;
}
.card-hd-l{display:flex;align-items:center;gap:10px}
.cico{
  width:28px;height:28px;border-radius:var(--r5);
  display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;
}
.cico-r{background:var(--cr-a);color:var(--cr2)}
.cico-g{background:var(--cg-a);color:var(--cg2)}
.cico-y{background:var(--cy-a);color:var(--cy2)}
.cico-n{background:var(--ink3);color:var(--t1)}
.cico-p{background:var(--cp-a);color:var(--cp2)}
.ct{font-size:13.5px;font-weight:700;color:var(--t0);letter-spacing:-.01em}
.cs{font-size:11px;color:var(--t2);margin-top:1px}
.card-bd{padding:17px}

/* ═══════════════════════════════════════════════════════════
   STAT TILES
═══════════════════════════════════════════════════════════ */
.stats-row{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));
  gap:9px;margin-bottom:12px;
}
.stat{
  background:var(--ink1);border:1px solid var(--border0);
  border-radius:var(--r14);padding:13px 14px;
  position:relative;overflow:hidden;
}
.stat::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  border-radius:var(--r14) var(--r14) 0 0;
}
.stat.sr::before{background:linear-gradient(90deg,var(--cr),transparent 70%)}
.stat.sg::before{background:linear-gradient(90deg,var(--cg),transparent 70%)}
.stat.sy::before{background:linear-gradient(90deg,var(--cy),transparent 70%)}
.stat.sn::before{background:linear-gradient(90deg,var(--t1),transparent 70%)}
.s-lbl{font-size:10px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
.s-val{font-size:20px;font-weight:800;line-height:1;letter-spacing:-.03em;font-family:var(--f-mono)}
.s-sub{font-size:10px;color:var(--t2);margin-top:3px;font-family:var(--f-mono)}
.stat.sr .s-val{color:var(--cr2)}
.stat.sg .s-val{color:var(--cg2)}
.stat.sy .s-val{color:var(--cy2)}
.stat.sn .s-val{color:var(--t0)}

/* ═══════════════════════════════════════════════════════════
   FORM ELEMENTS
═══════════════════════════════════════════════════════════ */
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg.full{grid-column:1/-1}
.lbl{
  font-size:10.5px;font-weight:600;color:var(--t1);
  letter-spacing:.05em;text-transform:uppercase;
}
.req-star{color:var(--cr2);margin-left:2px}
input,select,textarea{
  background:var(--ink2);border:1px solid var(--border1);
  border-radius:var(--r8);color:var(--t0);
  font-family:var(--f-sans);font-size:13.5px;
  padding:9px 12px;width:100%;outline:none;
  transition:border-color .15s,box-shadow .15s,background .15s;
  -webkit-appearance:none;
}
input:hover,select:hover{border-color:var(--border2);background:var(--ink3)}
input:focus,select:focus,textarea:focus{
  border-color:var(--cr);box-shadow:0 0 0 3px var(--cr-a);background:var(--ink2);
}
input::placeholder,textarea::placeholder{color:var(--t2)}
input:disabled{opacity:.3;cursor:not-allowed;background:var(--ink1)}
textarea{resize:vertical;min-height:78px;line-height:1.6}
select{cursor:pointer}
select option{background:var(--ink2)}
input[type=file]{display:none}

/* Direction toggle */
.dir-row{display:flex;gap:7px}
.dir-opt{
  flex:1;padding:9px;text-align:center;
  border-radius:var(--r8);border:1px solid var(--border1);
  background:var(--ink2);color:var(--t1);
  cursor:pointer;font-family:var(--f-sans);font-size:13px;font-weight:700;
  letter-spacing:.02em;transition:all .15s;
}
.dir-opt:hover{border-color:var(--border2);color:var(--t0);background:var(--ink3)}
.dir-opt.long.on{background:var(--cg-b);color:var(--cg2);border-color:var(--cg-d);box-shadow:0 0 12px var(--cg-a)}
.dir-opt.short.on{background:var(--cr-b);color:var(--cr2);border-color:var(--cr-d);box-shadow:0 0 12px var(--cr-a)}

/* PnL & RR display */
.val-box{
  padding:9px 12px;border-radius:var(--r8);
  border:1px solid var(--border1);background:var(--ink2);
  font-family:var(--f-mono);font-size:16px;font-weight:600;
  text-align:center;color:var(--t2);transition:all .2s;
}
.val-box.profit{background:var(--cg-a);border-color:var(--cg-d);color:var(--cg2)}
.val-box.loss{background:var(--cr-a);border-color:var(--cr-d);color:var(--cr2)}
.rr-display{
  padding:9px 12px;border-radius:var(--r8);
  border:1px solid var(--border1);background:var(--ink2);
  font-family:var(--f-mono);font-size:13px;font-weight:600;
  text-align:center;color:var(--t2);transition:all .2s;
}
.rr-display.poor{background:var(--cr-a);border-color:var(--cr-d);color:var(--cr2)}
.rr-display.decent{background:var(--cy-a);border-color:var(--cy-d);color:var(--cy2)}
.rr-display.strong{background:var(--cg-a);border-color:var(--cg-d);color:var(--cg2)}

/* File upload */
.file-btn{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:var(--r8);
  border:1.5px dashed var(--border1);background:var(--ink2);
  color:var(--t2);cursor:pointer;font-size:13px;font-weight:500;
  transition:all .15s;
}
.file-btn:hover{border-color:var(--cr);color:var(--cr2);background:var(--cr-a)}

/* ═══════════════════════════════════════════════════════════
   BUTTONS
═══════════════════════════════════════════════════════════ */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 15px;border-radius:var(--r8);
  border:1px solid var(--border1);background:var(--ink2);
  color:var(--t0);font-family:var(--f-sans);
  font-size:13px;font-weight:600;cursor:pointer;
  transition:all .14s;white-space:nowrap;
}
.btn:hover{background:var(--ink4);border-color:var(--border2)}
.btn:active{transform:scale(.97)}
.btn i{font-size:15px}
.btn-primary{
  background:linear-gradient(140deg,#c02020,#8a0d0d);
  border-color:var(--cr);color:#fff;
  box-shadow:0 0 20px var(--cr-c);
}
.btn-primary:hover{box-shadow:0 0 28px var(--cr-c);filter:brightness(1.08)}
.btn-primary:disabled{opacity:.35;cursor:not-allowed;pointer-events:none;box-shadow:none;filter:none}
.btn-approve{background:var(--cg-b);color:var(--cg2);border-color:var(--cg-d)}
.btn-approve:hover{background:var(--cg-c)}
.btn-approve:disabled{opacity:.3;cursor:not-allowed;pointer-events:none}
.btn-del{background:var(--cr-a);color:var(--cr2);border-color:var(--cr-d)}
.btn-del:hover{background:var(--cr-b)}
.btn-ghost{background:transparent;color:var(--t1);border-color:transparent}
.btn-ghost:hover{background:var(--ink3);color:var(--t0);border-color:var(--border1)}
.btn-sm{padding:5px 10px;font-size:11.5px;gap:5px}
.btn-sm i{font-size:13px}

/* ═══════════════════════════════════════════════════════════
   STATUS CHIPS (non-interactive)
═══════════════════════════════════════════════════════════ */
.ch{
  display:inline-flex;align-items:center;padding:3px 9px;
  border-radius:var(--r99);font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;
}
.ch-long{background:var(--cg-a);color:var(--cg2);border:1px solid var(--cg-d)}
.ch-short{background:var(--cr-a);color:var(--cr2);border:1px solid var(--cr-d)}
.ch-warn{background:var(--cy-a);color:var(--cy2);border:1px solid var(--cy-d)}
.ch-muted{background:var(--ink3);color:var(--t1);border:1px solid var(--border1)}
.ch-err{background:var(--cr-a);color:var(--cr2);border:1px solid var(--cr-d)}

/* ═══════════════════════════════════════════════════════════
   SELECTABLE PILLS — FIXED INTERACTION
   Root cause of bug: <label> wrapping <input> causes double
   click events. Solution: pure divs, onclick only, no inputs.
═══════════════════════════════════════════════════════════ */
.pill-wrap{display:flex;flex-wrap:wrap;gap:7px}
.pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:7px 13px;border-radius:var(--r99);
  border:1px solid var(--border1);background:var(--ink2);
  cursor:pointer;font-size:12px;font-weight:600;
  color:var(--t1);letter-spacing:.01em;
  user-select:none;
  transition:
    background .16s var(--ease),
    border-color .16s var(--ease),
    color .16s var(--ease),
    box-shadow .16s var(--ease),
    transform .1s var(--spring);
}
.pill:hover{border-color:var(--border2);color:var(--t0);background:var(--ink3);transform:translateY(-1px)}
.pill:active{transform:scale(.96)}

/* Mistake pill → red glow */
.pill.pm.sel{
  background:var(--cr-b);color:var(--cr2);border-color:var(--cr-d);
  box-shadow:0 0 14px var(--cr-a),inset 0 0 10px var(--cr-a);
  transform:translateY(-1px);
}
/* Action pill → gold glow */
.pill.pa.sel{
  background:var(--cy-b);color:var(--cy2);border-color:var(--cy-d);
  box-shadow:0 0 14px var(--cy-a),inset 0 0 10px var(--cy-a);
  transform:translateY(-1px);
}
/* Emotion pill → purple glow */
.pill.pe.sel{
  background:var(--cp-b);color:var(--cp2);border-color:var(--cp-d);
  box-shadow:0 0 14px var(--cp-a),inset 0 0 10px var(--cp-a);
  transform:translateY(-1px);
}

/* Win-context pill (for win-specific review) → green */
.pill.pw.sel{
  background:var(--cg-b);color:var(--cg2);border-color:var(--cg-d);
  box-shadow:0 0 14px var(--cg-a),inset 0 0 10px var(--cg-a);
  transform:translateY(-1px);
}

/* ═══════════════════════════════════════════════════════════
   RETAKE BUTTONS
═══════════════════════════════════════════════════════════ */
.retake-row{display:flex;gap:6px}
.rtk{
  flex:1;padding:9px;text-align:center;
  border-radius:var(--r8);border:1px solid var(--border1);
  background:var(--ink2);color:var(--t1);
  cursor:pointer;font-family:var(--f-sans);font-size:13px;font-weight:700;
  transition:all .15s;user-select:none;
}
.rtk:hover{border-color:var(--border2);color:var(--t0);background:var(--ink3)}
.rtk.on-yes{background:var(--cg-b);color:var(--cg2);border-color:var(--cg-d);box-shadow:0 0 10px var(--cg-a)}
.rtk.on-no{background:var(--cr-b);color:var(--cr2);border-color:var(--cr-d);box-shadow:0 0 10px var(--cr-a)}
.rtk.on-maybe{background:var(--cy-b);color:var(--cy2);border-color:var(--cy-d);box-shadow:0 0 10px var(--cy-a)}

/* ═══════════════════════════════════════════════════════════
   TRADE CARD
═══════════════════════════════════════════════════════════ */
.tc{
  background:var(--ink1);border:1px solid var(--border0);
  border-radius:var(--r14);padding:13px 16px;margin-bottom:8px;
  animation:up .16s var(--ease) both;
  transition:border-color .14s,background .14s;
}
.tc:hover{border-color:var(--border1);background:var(--ink2)}
.tc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:9px}
.tc-left{display:flex;align-items:center;gap:10px}
.tc-ico{
  width:36px;height:36px;border-radius:var(--r8);
  display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;
}
.tc-ico.long{background:var(--cg-a);color:var(--cg2)}
.tc-ico.short{background:var(--cr-a);color:var(--cr2)}
.tc-name{font-size:13px;font-weight:700;font-family:var(--f-mono);color:var(--t0);letter-spacing:.03em}
.tc-date{font-size:11px;color:var(--t2);margin-top:1px;font-family:var(--f-mono)}
.tc-pnl{font-size:19px;font-weight:800;font-family:var(--f-mono);letter-spacing:-.03em;line-height:1}
.tc-pnl.win{color:var(--cg2)}
.tc-pnl.loss{color:var(--cr2)}
.tc-pnl.flat{color:var(--t2)}
.tc-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.sep{color:var(--t2);font-size:11px}
.mv{font-size:12px;color:var(--t1);font-family:var(--f-mono)}

/* ═══════════════════════════════════════════════════════════
   REVIEW PANEL
═══════════════════════════════════════════════════════════ */
.rev-panel{
  margin-top:14px;border-top:1px solid var(--border0);padding-top:16px;
}
/* Win vs Loss context banner */
.ctx-banner{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;border-radius:var(--r8);
  margin-bottom:14px;font-size:12.5px;font-weight:600;
}
.ctx-banner.win-ctx{background:var(--cg-a);border:1px solid var(--cg-d);color:var(--cg2)}
.ctx-banner.loss-ctx{background:var(--cr-a);border:1px solid var(--cr-d);color:var(--cr2)}
.ctx-banner i{font-size:16px}

.rev-step{
  background:var(--ink2);border:1px solid var(--border0);
  border-radius:var(--r10);padding:14px 15px;margin-bottom:9px;
}
.rs-title{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;
}
.rs-left{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;color:var(--t1);text-transform:uppercase;letter-spacing:.07em}
.rs-left i{font-size:14px}
.badge-req{
  font-size:9px;color:var(--cr2);font-family:var(--f-mono);
  background:var(--cr-a);padding:2px 6px;border-radius:var(--r99);

}
.badge-ok{
  font-size:9px;color:var(--cg2);font-family:var(--f-mono);

  border:1px solid var(--cg-d);
}

  font-size:9px;color:var(--t2);font-family:var(--f-mono);

}

.rev-footer{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border0);

.rev-status{
  display:flex;align-items:center;gap:6px;

/* ═══════════════════════════════════════════════════════════
   MISC
═══════════════════════════════════════════════════════════ */
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-title{font-size:14px;font-weight:700;color:var(--t0);letter-spacing:-.01em}

.alert{
  display:flex;align-items:flex-start;gap:10px;
  padding:11px 14px;border-radius:var(--r8);font-size:13px;margin-bottom:14px;

/* settings tag editor */

  font-size:12px;color:var(--t0);
}
.te-tag button{

  transition:color .12s;font-family:var(--f-sans);padding:0;
}

.add-row{display:flex;gap:8px}
.add-row input{flex:1}

/* small mistake chips in trade table */
.mc{
  padding:2px 7px;border-radius:var(--r99);
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  background:var(--cr-a);color:var(--cr2);border:1px solid var(--cr-d);
}

}

/* ═══════════════════════════════════════════════════════════
   RESPONSIVE

  .fg2{grid-template-columns:1fr}
  .stats-row{grid-template-columns:1fr 1fr}
  .two-col{flex-direction:column}
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sb-top">
    <div class="sb-logo">
      <div class="sb-emblem"><i class="ti ti-chart-candle-filled"></i></div>
      <div class="sb-wordmark">
        <div class="sb-name">TradeLog</div>
        <div class="sb-tag">MNQ JOURNAL</div>
      </div>
    </div>
  </div>
  <nav class="sb-nav" id="sidebar-nav"></nav>
  <div class="sb-foot">
    <div class="mkt-row">
      <div class="mkt-dot"></div>
      <span class="mkt-name">MNQ</span>
      <span class="mkt-status">● LIVE</span>
    </div>
  </div>
</aside>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div class="pg-h">
      <div class="pg-title" id="pg-title">Log Trade</div>
      <div class="pg-sub" id="pg-sub">MNQ / MICRO NASDAQ FUTURES</div>
    </div>
    <div class="tb-r" id="tb-r"></div>
  </div>
  <div class="content" id="content"></div>
</div>

<script>
'use strict';
// ════════════════════════════════════════════════════════════════
//  CONSTANTS
// ════════════════════════════════════════════════════════════════
const DEFAULT_MISTAKES = [
  'FOMO entry','Entered too early','Entered too late','Overtrading',
  'Revenge trade','Risk too high','Ignored stop loss',"Didn't follow plan",
  'Emotional exit','No mistake / clean trade','Other'
];
const DEFAULT_IMPROVEMENTS = [
  'Wait for confirmation','Stick to plan','Reduce position size',
  'Avoid trading after loss','Improve timing','Other'
];
const EMOTIONS  = ['FOMO','Revenge','Hesitant','Overconfident','Greedy','Calm','Tired','Bored'];
const SESSIONS  = ['London','NY Open','Lunch','Power Hour','Asia'];

// Win-specific review items
const WIN_IMPROVEMENT = [
  'Exit was too early','Left profits on table','Position size too small',
  'Should have held longer','Execution was optimal','Followed plan perfectly','Other'
];

// Loss-specific review items (uses the standard mistake list + loss framing)
const LOSS_EXTRA = [
  'Setup was low quality','Idea was fundamentally wrong','Entry timing off',
  'News/event risk ignored','Market context misread'
];

// ════════════════════════════════════════════════════════════════
//  PERSISTENCE
// ════════════════════════════════════════════════════════════════
const load = (k,d) => { try { const v=localStorage.getItem(k); return v?JSON.parse(v):d } catch { return d } };
const save = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} };

let S = {
  tab: 'log',
  trades:      load('mnq_trades', []),
  mistakes:    load('mnq_mistakes', DEFAULT_MISTAKES),
  improvements:load('mnq_improvements', DEFAULT_IMPROVEMENTS),
  openReview:  null,
  draft:       null,   // { id, mistakes[], improvements[], emotions[], retake, problem, shouldhave, warning }
};
const persist = () => {
  save('mnq_trades', S.trades);
  save('mnq_mistakes', S.mistakes);
  save('mnq_improvements', S.improvements);
};

// ════════════════════════════════════════════════════════════════
//  HELPERS
// ════════════════════════════════════════════════════════════════
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

function calcPnL(entry, exit, size, dir) {
  const e=parseFloat(entry), x=parseFloat(exit), s=parseFloat(size)||1;
  if (!entry||!exit||isNaN(e)||isNaN(x)) return null;
  const ticks = dir==='long' ? (x-e)/0.25 : (e-x)/0.25;
  return +(ticks * 0.5 * s).toFixed(2);
}

function calcRR(entry, sl, tp, dir) {
  const e=parseFloat(entry), s=parseFloat(sl), t=parseFloat(tp);
  if (!entry||!sl||!tp||isNaN(e)||isNaN(s)||isNaN(t)) return null;
  const risk   = dir==='long' ? e-s : s-e;
  const reward = dir==='long' ? t-e : e-t;
  if (risk<=0||reward<=0) return null;
  return { risk, reward, ratio: +(reward/risk).toFixed(2) };
}

const rrCls = r => !r ? '' : r < 1 ? 'poor' : r < 2 ? 'decent' : 'strong';

const fmt = ts => {
  const d = new Date(ts);
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})
    + ' · ' + d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
};
const fmtWk  = k => { const d=new Date(k+'T00:00:00'); const s=new Date(d); s.setDate(d.getDate()+6); return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' – '+s.toLocaleDateString('en-US',{month:'short',day:'numeric'}); };
const fmtMo  = k => { const[y,m]=k.split('-'); return new Date(+y,+m-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'}); };

const approved = () => S.trades.filter(t => t.status==='approved');
const queued   = () => S.trades.filter(t => t.status==='queued');

const isWin    = t => t.pnl != null && t.pnl > 0;
const isLoss   = t => t.pnl != null && t.pnl <= 0;

// ════════════════════════════════════════════════════════════════
//  NAV CONFIG
// ════════════════════════════════════════════════════════════════
const PAGES = [
  { id:'log',       icon:'ti-circle-plus',          label:'Log Trade' },
  { id:'queue',     icon:'ti-clock-hour-4',          label:'Review Queue' },
  { id:'analytics', icon:'ti-chart-bar',             label:'Analytics' },
  { id:'recap',     icon:'ti-calendar-stats',         label:'Recap' },
  { id:'settings',  icon:'ti-adjustments-horizontal', label:'Settings' },
];
const PAGE_META = {
  log:      { title:'Log Trade',             sub:'MNQ / MICRO NASDAQ FUTURES' },
  queue:    { title:'Review Queue',          sub:'DEEP REVIEW — ALL FIELDS REQUIRED' },
  analytics:{ title:'Analytics',            sub:'APPROVED TRADES ONLY' },
  recap:    { title:'Weekly & Monthly Recap',sub:'PERFORMANCE OVER TIME' },
  settings: { title:'Settings',             sub:'CUSTOMISE YOUR JOURNAL' },
};

// ════════════════════════════════════════════════════════════════
//  RENDER ORCHESTRATOR
// ════════════════════════════════════════════════════════════════
function render() {
  const qc = queued().length;
  const meta = PAGE_META[S.tab];

  document.getElementById('sidebar-nav').innerHTML = PAGES.map(p => `
    <button class="nv${S.tab===p.id?' on':''}" onclick="setTab('${p.id}')">
      <i class="ti ${p.icon}"></i>
      <span>${p.label}</span>
      ${p.id==='queue' && qc ? `<span class="nv-badge">${qc}</span>` : ''}
    </button>`).join('');

  document.getElementById('pg-title').textContent = meta.title;
  document.getElementById('pg-sub').textContent   = meta.sub;

  const tr = document.getElementById('tb-r');
  if (S.tab==='analytics'||S.tab==='recap') {
    tr.innerHTML = `<span style="font-size:11px;color:var(--t2);font-family:var(--f-mono)">${approved().length} APPROVED</span>`;
  } else if (S.tab==='queue') {
    tr.innerHTML = qc
      ? `<span class="ch ch-err">${qc} PENDING</span>`
      : `<span class="ch ch-muted">CLEAR</span>`;
  } else {
    tr.innerHTML = '';
  }

  const c = document.getElementById('content');
  c.innerHTML = {
    log:       renderLog,
    queue:     renderQueue,
    analytics: renderAnalytics,
    recap:     renderRecap,
    settings:  renderSettings,
  }[S.tab]();
}

const setTab = t => { S.tab=t; S.openReview=null; render(); };

// ════════════════════════════════════════════════════════════════
//  LOG TRADE
// ════════════════════════════════════════════════════════════════
let LF = { dir:'long', entry:'', exit:'', size:'', sl:'', tp:'', session:'', notes:'' };
let pendingShot = null;

function renderLog() {
  const pnl = calcPnL(LF.entry, LF.exit, LF.size, LF.dir);
  const rr  = calcRR(LF.entry, LF.sl, LF.tp, LF.dir);
  const pnlCls = pnl===null ? '' : pnl>=0 ? ' profit' : ' loss';
  const pnlTxt = pnl===null ? '—' : (pnl>=0?'+':'')+pnl.toFixed(2);
  const rrCls2 = rr ? ' '+rrCls(rr.ratio) : '';
  const rrTxt  = rr ? `1:${rr.ratio}  ·  Risk ${rr.risk.toFixed(1)} / Reward ${rr.reward.toFixed(1)}` : 'Enter Entry + SL + TP';
  const recent = S.trades.filter(t=>t.status==='approved').slice(0,5);

  return `
  <div class="card">
    <div class="card-hd">
      <div class="card-hd-l">
        <div class="cico cico-r"><i class="ti ti-circle-plus"></i></div>
        <div><div class="ct">New Trade Entry</div><div class="cs">Added to Review Queue — not counted until approved</div></div>
      </div>
    </div>
    <div class="card-bd">
      <div class="fg2">
        <div class="fg">
          <div class="lbl">Asset</div>
          <input value="MNQ — Micro Nasdaq Futures" disabled>
        </div>
        <div class="fg">
          <div class="lbl">Session</div>
          <select id="lf-session" onchange="lfSet('session',this.value)">
            <option value="">Select session…</option>
            ${SESSIONS.map(s=>`<option value="${s}"${LF.session===s?' selected':''}>${s}</option>`).join('')}
          </select>
        </div>
        <div class="fg">
          <div class="lbl">Direction</div>
          <div class="dir-row">
            <div class="dir-opt long${LF.dir==='long'?' on':''}" onclick="lfDir('long')">▲ Long</div>
            <div class="dir-opt short${LF.dir==='short'?' on':''}" onclick="lfDir('short')">▼ Short</div>
          </div>
        </div>
        <div class="fg">
          <div class="lbl">Position Size <span style="color:var(--t2)">(contracts)</span></div>
          <input type="number" step="1" min="1" value="${LF.size}" placeholder="e.g. 2" oninput="lfSet('size',this.value)">
        </div>
        <div class="fg">
          <div class="lbl">Entry Price</div>
          <input type="number" step="0.25" value="${LF.entry}" placeholder="e.g. 21050.00" oninput="lfSet('entry',this.value)">
        </div>
        <div class="fg">
          <div class="lbl">Exit Price</div>
          <input type="number" step="0.25" value="${LF.exit}" placeholder="e.g. 21110.00" oninput="lfSet('exit',this.value)">
        </div>
        <div class="fg">
          <div class="lbl">Stop Loss (SL)</div>
          <input type="number" step="0.25" value="${LF.sl}" placeholder="e.g. 21030.00" oninput="lfSet('sl',this.value)">
        </div>
        <div class="fg">
          <div class="lbl">Take Profit (TP)</div>
          <input type="number" step="0.25" value="${LF.tp}" placeholder="e.g. 21110.00" oninput="lfSet('tp',this.value)">
        </div>
        <div class="fg">
          <div class="lbl">P&L (Auto-calc)</div>
          <div class="val-box${pnlCls}" id="pnl-display">${pnlTxt}</div>
        </div>
        <div class="fg">
          <div class="lbl">Planned RR</div>
          <div class="rr-display${rrCls2}" id="rr-display">${rrTxt}</div>
        </div>
        <div class="fg full">
          <div class="lbl">Screenshot <span style="color:var(--t2)">(optional)</span></div>
          <label class="file-btn" for="lf-shot">
            <i class="ti ti-photo"></i>
            <span id="shot-label">Attach chart screenshot…</span>
          </label>
          <input type="file" id="lf-shot" accept="image/*" onchange="handleShot(this)">
        </div>
        <div class="fg full">
          <div class="lbl">Notes <span style="color:var(--t2)">(optional)</span></div>
          <textarea placeholder="Setup description, market context…" oninput="lfSet('notes',this.value)">${LF.notes}</textarea>
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:17px;padding-top:15px;border-top:1px solid var(--border0)">
        <button class="btn btn-primary" onclick="submitTrade()">
          <i class="ti ti-arrow-right"></i> Add to Review Queue
        </button>
      </div>
    </div>
  </div>
  ${recent.length ? `<div class="sec-lbl"><i class="ti ti-history"></i> Recent Approved</div>${recent.map(tradeCard).join('')}` : ''}`;
}

function handleShot(el) {
  const f = el.files[0]; if (!f) return;
  document.getElementById('shot-label').textContent = f.name;
  const r = new FileReader();
  r.onload = e => { pendingShot = e.target.result; };
  r.readAsDataURL(f);
}

function lfSet(k, v) {
  LF[k] = v;
  // live update only the calculated displays (no full re-render)
  const pnl = calcPnL(LF.entry, LF.exit, LF.size, LF.dir);
  const pd = document.getElementById('pnl-display');
  if (pd) {
    pd.className = 'val-box' + (pnl===null?'':(pnl>=0?' profit':' loss'));
    pd.textContent = pnl===null ? '—' : (pnl>=0?'+':'')+pnl.toFixed(2);
  }
  const rr = calcRR(LF.entry, LF.sl, LF.tp, LF.dir);
  const rd = document.getElementById('rr-display');
  if (rd) {
    const cls = rr ? rrCls(rr.ratio) : '';
    rd.className = 'rr-display' + (cls?' '+cls:'');
    rd.textContent = rr ? `1:${rr.ratio}  ·  Risk ${rr.risk.toFixed(1)} / Reward ${rr.reward.toFixed(1)}` : 'Enter Entry + SL + TP';
  }
}

function lfDir(d) {
  LF.dir = d;
  document.querySelectorAll('.dir-opt').forEach(el => {
    el.classList.toggle('on', el.classList.contains(d));
  });
  lfSet('_', ''); // recalc displays
}

function submitTrade() {
  const entry = parseFloat(LF.entry), exit = parseFloat(LF.exit);
  if (isNaN(entry)||isNaN(exit)) { alert('Please enter entry and exit prices.'); return; }
  const pnl = calcPnL(LF.entry, LF.exit, LF.size, LF.dir);
  const rr  = calcRR(LF.entry, LF.sl, LF.tp, LF.dir);
  S.trades.unshift({
    id: uid(), ts: Date.now(), asset:'MNQ',
    direction: LF.dir, entry, exit,
    size: parseFloat(LF.size)||1,
    sl: parseFloat(LF.sl)||null,
    tp: parseFloat(LF.tp)||null,
    plannedRR: rr ? rr.ratio : null,
    pnl, notes: LF.notes.trim(),
    session: LF.session,
    screenshot: pendingShot,
    status: 'queued', review: null
  });
  persist();
  LF = { dir:'long', entry:'', exit:'', size:'', sl:'', tp:'', session:'', notes:'' };
  pendingShot = null;
  render();
}

// ════════════════════════════════════════════════════════════════
//  TRADE CARD (shared)
// ════════════════════════════════════════════════════════════════
function tradeCard(t) {
  const pnlTxt = t.pnl!=null ? (t.pnl>=0?'+':'')+t.pnl.toFixed(2) : '—';
  const pnlCls = t.pnl!=null ? (t.pnl>0?'win':'loss') : 'flat';
  const ico = t.direction==='long' ? 'ti-trending-up' : 'ti-trending-down';
  return `<div class="tc">
    <div class="tc-top">
      <div class="tc-left">
        <div class="tc-ico ${t.direction}"><i class="ti ${ico}"></i></div>
        <div>
          <div class="tc-name">MNQ${t.session?' · '+t.session:''}</div>
          <div class="tc-date">${fmt(t.ts)}</div>
        </div>
      </div>
      <div class="tc-pnl ${pnlCls}">${pnlTxt}</div>
    </div>
    <div class="tc-row">
      <span class="ch ch-${t.direction}">${t.direction}</span>
      <span class="mv">${t.entry}</span><span class="sep">→</span><span class="mv">${t.exit}</span>
      <span class="sep">·</span><span class="mv">${t.size}c</span>
      ${t.plannedRR?`<span class="sep">·</span><span class="rrb ${rrCls(t.plannedRR)}">1:${t.plannedRR}</span>`:''}
      ${t.notes?`<span class="sep">·</span><span style="font-size:11px;color:var(--t2)">${t.notes.slice(0,50)}${t.notes.length>50?'…':''}</span>`:''}
    </div>
  </div>`;
}

// ════════════════════════════════════════════════════════════════
//  REVIEW QUEUE
// ════════════════════════════════════════════════════════════════
function renderQueue() {
  const q = queued();
  if (!q.length) return `<div class="empty">
    <div class="empty-ico"><i class="ti ti-checks"></i></div>
    <h3>Review queue is clear</h3>
    <p>All trades reviewed. Log new trades to continue tracking your discipline.</p>
  </div>`;

  return `
  <div class="alert alert-warn">
    <i class="ti ti-alert-triangle"></i>
    All required fields must be completed before a trade can be approved.
    Only approved trades count toward your statistics.
  </div>
  <div class="sec-hd">
    <span class="sec-title">Pending Review <span style="color:var(--cr2);font-family:var(--f-mono)">(${q.length})</span></span>
  </div>
  ${q.map(qItem).join('')}`;
}

function qItem(t) {
  const open = S.openReview === t.id;
  const pnlTxt = t.pnl!=null ? (t.pnl>=0?'+':'')+t.pnl.toFixed(2) : '—';
  const pnlCls = t.pnl!=null ? (t.pnl>0?'win':'loss') : 'flat';
  const ico = t.direction==='long' ? 'ti-trending-up' : 'ti-trending-down';
  const win = isWin(t);

  // Get or initialise draft
  const D = (S.draft && S.draft.id===t.id) ? S.draft
    : { id:t.id, mistakes:[], improvements:[], emotions:[], retake:'', problem:'', shouldhave:'', warning:'' };

  const { ok, msg } = checkDraft(D, win);

  // Contextual mistake list: losses get extra options, wins use different framing
  const mistakeList = win
    ? S.mistakes
    : [...S.mistakes, ...LOSS_EXTRA.filter(x=>!S.mistakes.includes(x))];

  // Contextual improvement list
  const improvList = win ? WIN_IMPROVEMENT : S.improvements;

  // Contextual reflection prompts
  const prompts = win
    ? {
        p1: 'What could have been done better?',
        ph1:'e.g. I exited too early, could have held for more, missed a second entry…',
        p2: 'What did you miss or leave on the table?',
        ph2:'e.g. Failed to trail stop properly, ignored continuation signal…',
        p3: 'Was execution optimal? What would you repeat?',
        ph3:'e.g. Entry was precise, plan was followed, but size was too small…',
      }
    : {
        p1: 'What was the main cause of this loss?',
        ph1:'e.g. Entered too early, chased a breakout, emotional entry after a previous loss…',
        p2: 'What should have been done instead?',
        ph2:'e.g. Wait for reclaim confirmation, reduce risk, skip low-quality setup…',
        p3: 'What warning signs existed BEFORE you entered?',
        ph3:'e.g. Weak momentum, volume slowing, HTF resistance nearby, spread widening…',
      };

  return `<div class="tc" id="qi-${t.id}">
    <div class="tc-top">
      <div class="tc-left">
        <div class="tc-ico ${t.direction}"><i class="ti ${ico}"></i></div>
        <div>
          <div class="tc-name">MNQ${t.session?' · '+t.session:''}</div>
          <div class="tc-date">${fmt(t.ts)}</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:9px">
        <div class="tc-pnl ${pnlCls}">${pnlTxt}</div>
        ${t.plannedRR?`<span class="rrb ${rrCls(t.plannedRR)}">1:${t.plannedRR}</span>`:''}
        <button class="xbtn" onclick="toggleQ('${t.id}')">
          <i class="ti ti-chevron-${open?'up':'down'}"></i>${open?'Collapse':'Review'}
        </button>
      </div>
    </div>
    <div class="tc-row">
      <span class="ch ch-${t.direction}">${t.direction}</span>
      <span class="mv">${t.entry}</span><span class="sep">→</span><span class="mv">${t.exit}</span>
      <span class="sep">·</span><span class="mv">${t.size}c</span>
      ${t.notes?`<span class="sep">·</span><span style="font-size:11px;color:var(--t2)">${t.notes.slice(0,40)}${t.notes.length>40?'…':''}</span>`:''}
    </div>

    ${open ? `<div class="rev-panel">

      <!-- Context banner -->
      <div class="ctx-banner ${win?'win-ctx':'loss-ctx'}">
        <i class="ti ti-${win?'trending-up':'trending-down'}"></i>
        ${win
          ? `WIN TRADE — Focus on optimisation and refinement`
          : `LOSS TRADE — Focus on mistake analysis and correction`}
      </div>

      <!-- STEP 1: Mistakes / Observations -->
      <div class="rev-step">
        <div class="rs-title">
          <span class="rs-left">
            <i class="ti ti-alert-circle" style="color:var(--cr2)"></i>
            ${win ? 'What could improve?' : 'Mistakes made'}
          </span>
          <span id="s1-badge-${t.id}" class="${D.mistakes.length?'badge-ok':'badge-req'}">${D.mistakes.length?'✓ DONE':'REQUIRED'}</span>
        </div>
        <div class="pill-wrap" id="pm-${t.id}">
          ${mistakeList.map((m,i) => `
          <div class="pill pm${D.mistakes.includes(m)?' sel':''}"
               data-tid="${t.id}" data-field="mistakes" data-val="${encodeURI(m)}"
               onclick="togglePill(this)">
            ${m}
          </div>`).join('')}
        </div>
      </div>

      <!-- STEP 2: Emotions -->
      <div class="rev-step">
        <div class="rs-title">
          <span class="rs-left">
            <i class="ti ti-brain" style="color:var(--cp2)"></i>
            Emotional state
          </span>
          <span class="${D.emotions.length?'badge-ok':'badge-opt'}">${D.emotions.length?'✓ DONE':'OPTIONAL'}</span>
        </div>
        <div class="pill-wrap" id="pe-${t.id}">
          ${EMOTIONS.map(e => `
          <div class="pill pe${D.emotions.includes(e)?' sel':''}"
               data-tid="${t.id}" data-field="emotions" data-val="${encodeURI(e)}"
               onclick="togglePill(this)">
            ${e}
          </div>`).join('')}
        </div>
      </div>

      <!-- STEP 3: Actions / Improvements -->
      <div class="rev-step">
        <div class="rs-title">
          <span class="rs-left">
            <i class="ti ti-bulb" style="color:var(--cy2)"></i>
            ${win ? 'What you did right / what to keep' : 'Improvement actions'}
          </span>
          <span id="s3-badge-${t.id}" class="${D.improvements.length?'badge-ok':'badge-req'}">${D.improvements.length?'✓ DONE':'REQUIRED'}</span>
        </div>
        <div class="pill-wrap" id="pa-${t.id}">
          ${improvList.map(m => `
          <div class="pill pa${D.improvements.includes(m)?' sel':''}"
               data-tid="${t.id}" data-field="improvements" data-val="${encodeURI(m)}"
               onclick="togglePill(this)">
            ${m}
          </div>`).join('')}
        </div>
      </div>

      <!-- STEP 4: Written reflection -->
      <div class="rev-step">
        <div class="rs-title">
          <span class="rs-left">
            <i class="ti ti-writing" style="color:var(--t1)"></i>
            Written Reflection
          </span>
          <span id="s4-badge-${t.id}" class="${(D.problem&&D.shouldhave&&D.warning)?'badge-ok':'badge-req'}">${(D.problem&&D.shouldhave&&D.warning)?'✓ DONE':'REQUIRED — all 3 fields'}</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px">
          <div class="fg">
            <div class="lbl">${prompts.p1}<span class="req-star">*</span></div>
            <textarea style="min-height:82px" placeholder="${prompts.ph1}"
              oninput="draftText('${t.id}','problem',this.value)">${D.problem}</textarea>
          </div>
          <div class="fg">
            <div class="lbl">${prompts.p2}<span class="req-star">*</span></div>
            <textarea style="min-height:82px" placeholder="${prompts.ph2}"
              oninput="draftText('${t.id}','shouldhave',this.value)">${D.shouldhave}</textarea>
          </div>
          <div class="fg">
            <div class="lbl">${prompts.p3}<span class="req-star">*</span></div>
            <textarea style="min-height:82px" placeholder="${prompts.ph3}"
              oninput="draftText('${t.id}','warning',this.value)">${D.warning}</textarea>
          </div>
        </div>
      </div>

      <!-- STEP 5: Retake -->
      <div class="rev-step">
        <div class="rs-title">
          <span class="rs-left">
            <i class="ti ti-repeat" style="color:var(--t1)"></i>
            Would you take this trade again?
          </span>
          <span id="s5-badge-${t.id}" class="${D.retake?'badge-ok':'badge-req'}">${D.retake?'✓ DONE':'REQUIRED'}</span>
        </div>
        <div class="retake-row">
          <div class="rtk${D.retake==='yes'?' on-yes':''}" onclick="draftRetake('${t.id}','yes')">Yes</div>
          <div class="rtk${D.retake==='no'?' on-no':''}" onclick="draftRetake('${t.id}','no')">No</div>
          <div class="rtk${D.retake==='maybe'?' on-maybe':''}" onclick="draftRetake('${t.id}','maybe')">Maybe</div>
        </div>
      </div>

      <!-- Footer -->
      <div class="rev-footer">
        <div class="rev-status${ok?' ready':''}" id="rev-status-${t.id}">
          <i class="ti ti-${ok?'circle-check':'lock'}"></i>
          ${ok ? 'Ready to approve' : msg}
        </div>
        <div class="rev-btns">
          <button class="btn btn-del btn-sm" onclick="deleteTrade('${t.id}')">
            <i class="ti ti-trash"></i> Delete
          </button>
          <button class="btn btn-approve" id="approve-btn-${t.id}" ${!ok?'disabled':''} onclick="approveTrade('${t.id}')">
            <i class="ti ti-circle-check"></i> Approve Trade
          </button>
        </div>
      </div>

    </div>` : ''}
  </div>`;
}

// ─── VALIDATION ──────────────────────────────────────────────
function checkDraft(D, win) {
  const issues = [];
  if (!D.mistakes.length)                         issues.push('select at least one observation');
  if (!D.improvements.length)                     issues.push('select at least one action/note');
  if (!D.problem  || D.problem.trim().length < 8) issues.push('fill in reflection field 1 (8+ chars)');
  if (!D.shouldhave||D.shouldhave.trim().length<8)issues.push('fill in reflection field 2');
  if (!D.warning  || D.warning.trim().length  < 8)issues.push('fill in reflection field 3');
  if (!D.retake)                                   issues.push('answer the retake question');
  return { ok: issues.length===0, msg: issues[0]||'' };
}

// ─── DRAFT MANAGEMENT ────────────────────────────────────────
function ensureDraft(tid) {
  if (!S.draft || S.draft.id !== tid) {
    S.draft = { id:tid, mistakes:[], improvements:[], emotions:[], retake:'', problem:'', shouldhave:'', warning:'' };
  }
}

// ─── PILL TOGGLE (THE FIXED CORE) ────────────────────────────
// Using data attributes + direct DOM class manipulation.
// NO <label>/<input> wrapping — eliminates double-click bug.
function togglePill(el) {
  const tid   = el.dataset.tid;
  const field = el.dataset.field;
  const val   = decodeURI(el.dataset.val);

  ensureDraft(tid);
  const arr = S.draft[field];
  const idx = arr.indexOf(val);
  if (idx >= 0) arr.splice(idx, 1); else arr.push(val);

  // Toggle visual state immediately (no re-render needed)
  el.classList.toggle('sel');

  // Update step badges & approve button without full re-render
  refreshDraftUI(tid);
}

function draftRetake(tid, val) {
  ensureDraft(tid);
  S.draft.retake = val;
  // Update retake button states
  document.querySelectorAll(`#qi-${tid} .rtk`).forEach(b => {
    b.className = 'rtk' + (b.textContent.trim().toLowerCase()===val ? ` on-${val}` : '');
  });
  refreshDraftUI(tid);
}

function draftText(tid, field, val) {
  ensureDraft(tid);
  S.draft[field] = val;
  refreshDraftUI(tid);
}

function refreshDraftUI(tid) {
  if (!S.draft || S.draft.id !== tid) return;
  const D = S.draft;
  const t = S.trades.find(t => t.id===tid);
  const win = t ? isWin(t) : false;
  const { ok, msg } = checkDraft(D, win);

  const setBadge = (id, cond) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.className = cond ? 'badge-ok' : 'badge-req';
    el.textContent = cond ? '✓ DONE' : (id.startsWith('s1')||id.startsWith('s3')||id.startsWith('s5')) ? 'REQUIRED' : 'REQUIRED — all 3 fields';
  };

  setBadge(`s1-badge-${tid}`, D.mistakes.length > 0);
  setBadge(`s3-badge-${tid}`, D.improvements.length > 0);
  setBadge(`s4-badge-${tid}`, D.problem.trim().length>=8 && D.shouldhave.trim().length>=8 && D.warning.trim().length>=8);
  setBadge(`s5-badge-${tid}`, !!D.retake);

  const statusEl = document.getElementById(`rev-status-${tid}`);
  if (statusEl) {
    statusEl.className = 'rev-status' + (ok?' ready':'');
    statusEl.innerHTML = `<i class="ti ti-${ok?'circle-check':'lock'}"></i> ${ok?'Ready to approve':msg}`;
  }
  const approveEl = document.getElementById(`approve-btn-${tid}`);
  if (approveEl) approveEl.disabled = !ok;
}

// ─── REVIEW ACTIONS ──────────────────────────────────────────
function toggleQ(id) {
  S.openReview = S.openReview===id ? null : id;
  if (S.openReview===id) ensureDraft(id);
  render();
}

function approveTrade(id) {
  const t = S.trades.find(t => t.id===id); if (!t) return;
  ensureDraft(id);
  const win = isWin(t);
  const { ok } = checkDraft(S.draft, win);
  if (!ok) { alert('Please complete all required review fields.'); return; }
  t.status = 'approved';
  t.review = {
    mistakes:     S.draft.mistakes.slice(),
    improvements: S.draft.improvements.slice(),
    emotions:     S.draft.emotions.slice(),
    retake:       S.draft.retake,
    problem:      S.draft.problem,
    shouldhave:   S.draft.shouldhave,
    warning:      S.draft.warning,
  };
  t.approvedAt = Date.now();
  S.draft = null; S.openReview = null;
  persist(); render();
}

function deleteTrade(id) {
  if (!confirm('Delete this trade? Cannot be undone.')) return;
  S.trades = S.trades.filter(t => t.id!==id);
  persist(); render();
}

// ════════════════════════════════════════════════════════════════
//  ANALYTICS
// ════════════════════════════════════════════════════════════════
function renderAnalytics() {
  const trades = approved();
  if (!trades.length) return `<div class="empty">
    <div class="empty-ico"><i class="ti ti-chart-bar"></i></div>
    <h3>No data yet</h3>
    <p>Approve trades in the Review Queue to see analytics.</p>
    <button class="btn" onclick="setTab('queue')"><i class="ti ti-arrow-right"></i> Go to Queue</button>
  </div>`;

  const wins   = trades.filter(t=>t.pnl>0);
  const losses = trades.filter(t=>t.pnl<=0);
  const wr     = (wins.length/trades.length*100).toFixed(1);
  const total  = trades.reduce((s,t)=>s+(t.pnl||0), 0);
  const avgW   = wins.length   ? wins.reduce((s,t)=>s+t.pnl,0)/wins.length   : 0;
  const avgL   = losses.length ? Math.abs(losses.reduce((s,t)=>s+t.pnl,0)/losses.length) : 0;
  const actRR  = avgL>0 ? (avgW/avgL).toFixed(2) : '—';
  const prrs   = trades.filter(t=>t.plannedRR).map(t=>t.plannedRR);
  const avgPRR = prrs.length ? (prrs.reduce((a,b)=>a+b,0)/prrs.length).toFixed(2) : '—';

  // Mistake frequency
  const mC = {};
  trades.forEach(t=>(t.review?.mistakes||[]).forEach(m=>{if(m!=='No mistake / clean trade')mC[m]=(mC[m]||0)+1}));
  const topM = Object.entries(mC).sort((a,b)=>b[1]-a[1]).slice(0,7);
  const maxM = topM[0]?.[1]||1;

  // Emotion frequency
  const eC = {};
  trades.forEach(t=>(t.review?.emotions||[]).forEach(e=>{eC[e]=(eC[e]||0)+1}));
  const topE = Object.entries(eC).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxE = topE[0]?.[1]||1;

  // Session
  const sC = {};
  trades.forEach(t=>{if(t.session)sC[t.session]=(sC[t.session]||0)+1});

  const viol  = trades.filter(t=>(t.review?.mistakes||[]).some(m=>m!=='No mistake / clean trade'&&m!=='Other')).length;
  const clean = trades.filter(t=>(t.review?.mistakes||[]).includes('No mistake / clean trade')).length;

  return `
  <div class="stats-row">
    <div class="stat sn"><div class="s-lbl">Trades</div><div class="s-val">${trades.length}</div></div>
    <div class="stat ${parseFloat(wr)>=50?'sg':'sr'}"><div class="s-lbl">Win Rate</div><div class="s-val">${wr}%</div></div>
    <div class="stat ${total>=0?'sg':'sr'}"><div class="s-lbl">Total P&L</div><div class="s-val">${total>=0?'+':''}${total.toFixed(2)}</div></div>
    <div class="stat sy"><div class="s-lbl">Actual RR</div><div class="s-val">${actRR}</div></div>
    <div class="stat sy"><div class="s-lbl">Planned RR</div><div class="s-val">${avgPRR}</div><div class="s-sub">avg of ${prrs.length}</div></div>
    <div class="stat sr"><div class="s-lbl">Violations</div><div class="s-val">${viol}</div><div class="s-sub">of ${trades.length}</div></div>
    <div class="stat sg"><div class="s-lbl">Clean</div><div class="s-val">${clean}</div><div class="s-sub">${trades.length?Math.round(clean/trades.length*100):0}%</div></div>
  </div>

  <div class="two-col" style="margin-bottom:10px">
    <div class="col">
      <div class="card">
        <div class="card-hd"><div class="card-hd-l"><div class="cico cico-r"><i class="ti ti-alert-circle"></i></div><div class="ct">Mistake Frequency</div></div></div>
        <div class="card-bd">
          ${topM.length ? topM.map(([m,c])=>`
          <div class="bar-row">
            <div class="bar-lbl" title="${m}">${m}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${Math.round(c/maxM*100)}%"></div></div>
            <div class="bar-count">${c}</div>
          </div>`).join('') : `<div style="color:var(--t2);font-size:12px">No mistake data yet.</div>`}
        </div>
      </div>
    </div>
    <div class="col">
      <div class="card">
        <div class="card-hd"><div class="card-hd-l"><div class="cico cico-p"><i class="ti ti-brain"></i></div><div class="ct">Emotional States</div></div></div>
        <div class="card-bd">
          ${topE.length ? topE.map(([e,c])=>`
          <div class="bar-row">
            <div class="bar-lbl">${e}</div>
            <div class="bar-track"><div class="bar-fill y" style="width:${Math.round(c/maxE*100)}%"></div></div>
            <div class="bar-count">${c}</div>
          </div>`).join('') : `<div style="color:var(--t2);font-size:12px">No emotion data yet.</div>`}
        </div>
      </div>
    </div>
  </div>

  <div class="two-col" style="margin-bottom:10px">
    <div class="col">
      <div class="card">
        <div class="card-hd"><div class="card-hd-l"><div class="cico cico-n"><i class="ti ti-repeat"></i></div><div class="ct">Retake Distribution</div></div></div>
        <div class="card-bd">
          ${['yes','no','maybe'].map(r=>{
            const cnt=trades.filter(t=>t.review?.retake===r).length;
            const pct=trades.length?Math.round(cnt/trades.length*100):0;
            const cl=r==='yes'?'var(--cg)':r==='no'?'var(--cr)':'var(--cy)';
            return`<div class="bar-row">
              <div class="bar-lbl" style="color:${cl};text-transform:capitalize">${r}</div>
              <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${cl}"></div></div>
              <div class="bar-count">${cnt}</div>
            </div>`;
          }).join('')}
          <div class="divider" style="margin:10px 0"></div>
          <div style="display:flex;gap:16px;font-size:11px;color:var(--t1);font-family:var(--f-mono)">
            <span>Avg win <span style="color:var(--cg2)">+${avgW.toFixed(2)}</span></span>
            <span>Avg loss <span style="color:var(--cr2)">-${avgL.toFixed(2)}</span></span>
          </div>
        </div>
      </div>
    </div>
    <div class="col">
      <div class="card">
        <div class="card-hd"><div class="card-hd-l"><div class="cico cico-n"><i class="ti ti-clock"></i></div><div class="ct">Sessions</div></div></div>
        <div class="card-bd">
          ${Object.keys(sC).length ? SESSIONS.filter(s=>sC[s]).map(s=>{
            const c=sC[s]; const pct=Math.round(c/trades.length*100);
            return`<div class="bar-row">
              <div class="bar-lbl">${s}</div>
              <div class="bar-track"><div class="bar-fill g" style="width:${pct}%"></div></div>
              <div class="bar-count">${c}</div>
            </div>`;
          }).join('') : `<div style="color:var(--t2);font-size:12px">No session data — select session when logging.</div>`}
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-hd"><div class="card-hd-l"><div class="cico cico-n"><i class="ti ti-list-details"></i></div><div class="ct">All Approved Trades</div></div></div>
    <div class="card-bd" style="padding:0">
      <table class="dtbl">
        <thead><tr><th>Date</th><th>Dir</th><th>Entry</th><th>Exit</th><th>Sz</th><th>P&L</th><th>RR</th><th>Mistakes</th></tr></thead>
        <tbody>${trades.map(t=>{
          const p  = t.pnl!=null?(t.pnl>=0?'+':'')+t.pnl.toFixed(2):'—';
          const pc = t.pnl>0?'var(--cg2)':t.pnl<0?'var(--cr2)':'var(--t2)';
          const ms = (t.review?.mistakes||[]).filter(m=>m!=='No mistake / clean trade').slice(0,2);
          return`<tr>
            <td style="color:var(--t2);font-size:11px;font-family:var(--f-mono)">${new Date(t.ts).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</td>
            <td><span class="ch ch-${t.direction}">${t.direction}</span></td>
            <td style="font-family:var(--f-mono)">${t.entry}</td>
            <td style="font-family:var(--f-mono)">${t.exit}</td>
            <td style="font-family:var(--f-mono)">${t.size}c</td>
            <td style="font-family:var(--f-mono);font-weight:700;color:${pc}">${p}</td>
            <td>${t.plannedRR?`<span class="rrb ${rrCls(t.plannedRR)}">1:${t.plannedRR}</span>`:'<span style="color:var(--t2)">—</span>'}</td>
            <td>${ms.map(m=>`<span class="mc">${m}</span>`).join(' ')||'<span style="color:var(--t2);font-size:11px">—</span>'}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    </div>
  </div>`;
}

// ════════════════════════════════════════════════════════════════
//  RECAP
// ════════════════════════════════════════════════════════════════
function renderRecap() {
  const trades = approved();
  if (!trades.length) return `<div class="empty">
    <div class="empty-ico"><i class="ti ti-calendar"></i></div>
    <h3>No recap data</h3><p>Approve trades to see performance summaries.</p>
  </div>`;

  const groupBy = fn => { const m={}; trades.forEach(t=>{const k=fn(t);if(!m[k])m[k]=[];m[k].push(t)}); return m; };
  const wk = t => { const d=new Date(t.ts),mn=new Date(d); mn.setDate(d.getDate()-d.getDay()+1); return mn.toISOString().slice(0,10); };
  const mo = t => { const d=new Date(t.ts); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; };
  const sum = g => {
    const wins=g.filter(t=>t.pnl>0), pnl=g.reduce((s,t)=>s+(t.pnl||0),0);
    const mc={}; g.forEach(t=>(t.review?.mistakes||[]).forEach(m=>{if(m!=='No mistake / clean trade')mc[m]=(mc[m]||0)+1}));
    return { count:g.length, wins:wins.length, pnl, top:Object.entries(mc).sort((a,b)=>b[1]-a[1])[0]?.[0]||'—' };
  };
  const tbl = (rows, kFmt) => `<table class="dtbl"><thead><tr>
    <th>Period</th><th>Trades</th><th>Win%</th><th>P&L</th><th>Top Mistake</th>
  </tr></thead><tbody>${rows.map(([k,g])=>{
    const s=sum(g), wr=Math.round(s.wins/s.count*100);
    return`<tr>
      <td style="font-size:12px;color:var(--t1);font-weight:600;font-family:var(--f-mono)">${kFmt(k)}</td>
      <td style="font-family:var(--f-mono)">${s.count}</td>
      <td style="font-family:var(--f-mono);font-weight:700;color:${wr>=50?'var(--cg2)':'var(--cr2)'}">${wr}%</td>
      <td style="font-family:var(--f-mono);font-weight:700;color:${s.pnl>=0?'var(--cg2)':'var(--cr2)'}">${s.pnl>=0?'+':''}${s.pnl.toFixed(2)}</td>
      <td style="font-size:11px;color:var(--cy2)">${s.top.slice(0,32)}</td>
    </tr>`;
  }).join('')}</tbody></table>`;

  const weeks  = Object.entries(groupBy(wk)).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,8);
  const months = Object.entries(groupBy(mo)).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,6);

  return `
  <div class="card">
    <div class="card-hd"><div class="card-hd-l"><div class="cico cico-n"><i class="ti ti-calendar-week"></i></div><div class="ct">Weekly Recap</div></div></div>
    <div class="card-bd" style="padding:0">${tbl(weeks,fmtWk)}</div>
  </div>
  <div class="card">
    <div class="card-hd"><div class="card-hd-l"><div class="cico cico-n"><i class="ti ti-calendar-month"></i></div><div class="ct">Monthly Recap</div></div></div>
    <div class="card-bd" style="padding:0">${tbl(months,fmtMo)}</div>
  </div>`;
}

// ════════════════════════════════════════════════════════════════
//  SETTINGS
// ════════════════════════════════════════════════════════════════
function renderSettings() {
  return `
  <div class="card">
    <div class="card-hd"><div class="card-hd-l"><div class="cico cico-r"><i class="ti ti-alert-circle"></i></div>
      <div><div class="ct">Mistake List</div><div class="cs">Tags used during trade review</div></div></div></div>
    <div class="card-bd">
      <div class="te">${S.mistakes.map((m,i)=>`
        <div class="te-tag"><span>${m}</span><button onclick="rmMistake(${i})">×</button></div>`).join('')}</div>
      <div class="add-row">
        <input id="nm" placeholder="Add new mistake type…" onkeydown="if(event.key==='Enter')addMistake()">
        <button class="btn" onclick="addMistake()"><i class="ti ti-plus"></i> Add</button>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-hd"><div class="card-hd-l"><div class="cico cico-y"><i class="ti ti-bulb"></i></div>
      <div><div class="ct">Improvement Actions</div><div class="cs">Loss-review actions (wins use preset optimisation list)</div></div></div></div>
    <div class="card-bd">
      <div class="te">${S.improvements.map((m,i)=>`
        <div class="te-tag"><span>${m}</span><button onclick="rmImprove(${i})">×</button></div>`).join('')}</div>
      <div class="add-row">
        <input id="ni" placeholder="Add new improvement action…" onkeydown="if(event.key==='Enter')addImprove()">
        <button class="btn" onclick="addImprove()"><i class="ti ti-plus"></i> Add</button>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-hd"><div class="card-hd-l"><div class="cico cico-y"><i class="ti ti-chart-candle"></i></div>
      <div><div class="ct">Default Market</div><div class="cs">Locked — no other instruments</div></div></div></div>
    <div class="card-bd"><input value="MNQ — Micro Nasdaq Futures" disabled></div>
  </div>
  <div class="card">
    <div class="card-hd"><div class="card-hd-l"><div class="cico cico-n"><i class="ti ti-database"></i></div>
      <div><div class="ct">Data Management</div>
      <div class="cs">${S.trades.length} trades · ${approved().length} approved · ${queued().length} queued</div></div></div></div>
    <div class="card-bd">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" onclick="doExportJSON()"><i class="ti ti-download"></i> Export JSON</button>
        <button class="btn" onclick="doExportCSV()"><i class="ti ti-file-spreadsheet"></i> Export CSV</button>
        <button class="btn btn-del" onclick="doClear()"><i class="ti ti-trash"></i> Clear All Data</button>
      </div>
    </div>
  </div>`;
}

function addMistake(){ const v=document.getElementById('nm').value.trim(); if(!v)return; S.mistakes.push(v); persist(); render(); }
function rmMistake(i){ if(!confirm('Remove this mistake type?'))return; S.mistakes.splice(i,1); persist(); render(); }
function addImprove(){ const v=document.getElementById('ni').value.trim(); if(!v)return; S.improvements.push(v); persist(); render(); }
function rmImprove(i){ if(!confirm('Remove this action?'))return; S.improvements.splice(i,1); persist(); render(); }

function doExportJSON(){
  const b=new Blob([JSON.stringify(S.trades,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download='mnq-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
}
function doExportCSV(){
  const h=['Date','Direction','Entry','Exit','Size','SL','TP','PlannedRR','PnL','Session','Status','Mistakes','Emotions','Retake','Problem','ShouldHave','Warning','Notes'];
  const rows=S.trades.map(t=>[
    new Date(t.ts).toISOString(),t.direction,t.entry,t.exit,t.size,
    t.sl||'',t.tp||'',t.plannedRR||'',t.pnl||'',t.session||'',t.status,
    (t.review?.mistakes||[]).join('; '),
    (t.review?.emotions||[]).join('; '),
    t.review?.retake||'',
    (t.review?.problem||'').replace(/[,\n]/g,' '),
    (t.review?.shouldhave||'').replace(/[,\n]/g,' '),
    (t.review?.warning||'').replace(/[,\n]/g,' '),
    (t.notes||'').replace(/[,\n]/g,' '),
  ]);
  const csv=[h,...rows].map(r=>r.join(',')).join('\n');
  const b=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download='mnq-'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
}
function doClear(){
  if(!confirm('CLEAR ALL DATA? This will permanently delete all trades.'))return;
  if(!confirm('Absolutely sure? This cannot be undone.'))return;
  S.trades=[]; persist(); render();
}

// ════════════════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════════════════
render();
</script>
</body>
</html>
