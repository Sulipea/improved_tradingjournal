<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MNQ Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
/* ── RESET ── */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}

/* ── DESIGN TOKENS ── */
:root{
  /* surfaces — dark red/black terminal */
  --s0:#080a0c;
  --s1:#0e1015;
  --s2:#13161d;
  --s3:#181c25;
  --s4:#1e232e;
  --s5:#252b38;
  /* borders */
  --b0:rgba(255,255,255,0.04);
  --b1:rgba(255,255,255,0.08);
  --b2:rgba(255,255,255,0.14);
  --b3:rgba(255,255,255,0.22);
  /* red accent palette */
  --red:#e03030;
  --red2:#ff4444;
  --red-dim:rgba(224,48,48,0.08);
  --red-mid:rgba(224,48,48,0.16);
  --red-glow:rgba(224,48,48,0.28);
  --red-border:rgba(224,48,48,0.35);
  /* green */
  --grn:#1eba6c;
  --grn-dim:rgba(30,186,108,0.08);
  --grn-mid:rgba(30,186,108,0.16);
  --grn-border:rgba(30,186,108,0.35);
  /* gold */
  --gld:#d4a817;
  --gld-dim:rgba(212,168,23,0.08);
  --gld-mid:rgba(212,168,23,0.16);
  --gld-border:rgba(212,168,23,0.35);
  /* text */
  --t0:#f0f3f8;
  --t1:#7a8499;
  --t2:#3d4455;
  /* type */
  --sans:'Syne',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
  /* radii */
  --r2:4px;--r4:6px;--r6:8px;--r8:10px;--r12:12px;--r16:16px;
  /* sidebar */
  --sw:218px;
  --ease:cubic-bezier(.4,0,.2,1);
}

/* ── BASE ── */
body{font-family:var(--sans);background:var(--s0);color:var(--t0);font-size:14px;line-height:1.5;display:flex;height:100vh}

/* ─────────────────────────────────
   SIDEBAR
───────────────────────────────── */
.sidebar{
  width:var(--sw);min-width:var(--sw);
  height:100vh;background:var(--s1);
  border-right:1px solid var(--b0);
  display:flex;flex-direction:column;
  flex-shrink:0;position:relative;z-index:20;
}
/* subtle noise texture on sidebar */
.sidebar::before{
  content:'';position:absolute;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  opacity:0.4;pointer-events:none;
}
.sb-brand{
  padding:20px 16px 16px;
  border-bottom:1px solid var(--b0);
  position:relative;
}
.sb-logorow{display:flex;align-items:center;gap:10px}
.sb-glyph{
  width:34px;height:34px;
  background:linear-gradient(135deg,var(--red),#8b0000);
  border-radius:var(--r6);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:17px;flex-shrink:0;
  box-shadow:0 0 12px var(--red-glow);
}
.sb-name{font-size:15px;font-weight:700;color:var(--t0);letter-spacing:-.02em}
.sb-sub{font-size:10px;color:var(--t2);font-family:var(--mono);letter-spacing:.06em;margin-top:1px}

.sb-nav{padding:10px 8px;flex:1;display:flex;flex-direction:column;gap:1px;position:relative}
.nav-item{
  width:100%;display:flex;align-items:center;gap:9px;
  padding:9px 10px;
  border-radius:var(--r6);border:none;
  background:transparent;color:var(--t1);
  cursor:pointer;font-family:var(--sans);font-size:13px;font-weight:500;
  text-align:left;
  transition:background .15s var(--ease),color .15s var(--ease),border-color .15s var(--ease);
  position:relative;
}
.nav-item i{font-size:16px;flex-shrink:0;color:var(--t2);transition:color .15s var(--ease)}
.nav-item:hover{background:var(--s3);color:var(--t0)}
.nav-item:hover i{color:var(--t1)}
.nav-item.act{
  background:var(--red-dim);color:var(--red2);
  border:1px solid var(--red-border);
}
.nav-item.act::before{
  content:'';position:absolute;left:-1px;top:20%;bottom:20%;
  width:2px;background:var(--red2);border-radius:2px;
  box-shadow:0 0 8px var(--red);
}
.nav-item.act i{color:var(--red2)}
.nav-badge{
  margin-left:auto;
  background:var(--red);color:#fff;
  font-size:10px;font-weight:700;
  padding:1px 6px;border-radius:20px;line-height:1.6;
  box-shadow:0 0 6px var(--red-glow);
}

.sb-foot{padding:10px 8px;border-top:1px solid var(--b0);position:relative}
.mkt-pill{
  display:flex;align-items:center;gap:8px;
  padding:9px 12px;
  background:var(--s2);border-radius:var(--r6);
  border:1px solid var(--b1);
}
.mkt-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--grn);
  box-shadow:0 0 8px var(--grn);
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 8px var(--grn)}50%{opacity:.5;box-shadow:0 0 3px var(--grn)}}
.mkt-name{font-size:12px;font-weight:700;font-family:var(--mono);color:var(--t0);letter-spacing:.06em}
.mkt-live{font-size:10px;color:var(--grn);font-family:var(--mono);margin-left:auto;letter-spacing:.05em}

/* ─────────────────────────────────
   MAIN AREA
───────────────────────────────── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{
  height:54px;
  background:var(--s1);
  border-bottom:1px solid var(--b0);
  padding:0 24px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.pg-title{font-size:14px;font-weight:700;color:var(--t0);letter-spacing:-.01em}
.pg-sub{font-size:11px;color:var(--t2);margin-top:1px;font-family:var(--mono)}
.tb-right{display:flex;align-items:center;gap:8px}
.content{
  flex:1;overflow-y:auto;
  padding:22px;background:var(--s0);
}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-track{background:transparent}
.content::-webkit-scrollbar-thumb{background:var(--s4);border-radius:4px}

/* ─────────────────────────────────
   CARDS
───────────────────────────────── */
.card{
  background:var(--s1);
  border:1px solid var(--b0);
  border-radius:var(--r12);
  overflow:hidden;margin-bottom:12px;
  animation:fadeUp .2s var(--ease) both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.card-hd{
  padding:14px 18px;
  border-bottom:1px solid var(--b0);
  display:flex;align-items:center;justify-content:space-between;
}
.card-hd-l{display:flex;align-items:center;gap:10px}
.card-ico{
  width:28px;height:28px;border-radius:var(--r4);
  display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;
}
.ico-red{background:var(--red-dim);color:var(--red2)}
.ico-grn{background:var(--grn-dim);color:var(--grn)}
.ico-gld{background:var(--gld-dim);color:var(--gld)}
.ico-wht{background:var(--s3);color:var(--t1)}
.card-ttl{font-size:13.5px;font-weight:700;color:var(--t0);letter-spacing:-.01em}
.card-stl{font-size:11px;color:var(--t2);margin-top:1px}
.card-bd{padding:18px}

/* ─────────────────────────────────
   STAT TILES
───────────────────────────────── */
.stats-row{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(128px,1fr));
  gap:10px;margin-bottom:14px;
}
.stat{
  background:var(--s1);border:1px solid var(--b0);
  border-radius:var(--r12);padding:14px 15px;
  position:relative;overflow:hidden;
}
.stat::after{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  border-radius:var(--r12) var(--r12) 0 0;
  background:transparent;transition:background .3s;
}
.stat.red::after{background:linear-gradient(90deg,var(--red),transparent)}
.stat.grn::after{background:linear-gradient(90deg,var(--grn),transparent)}
.stat.gld::after{background:linear-gradient(90deg,var(--gld),transparent)}
.stat.wht::after{background:linear-gradient(90deg,var(--t1),transparent)}
.stat-lbl{font-size:10px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.stat-val{font-size:21px;font-weight:700;line-height:1;letter-spacing:-.03em;font-family:var(--mono)}
.stat-sub{font-size:10px;color:var(--t2);margin-top:4px;font-family:var(--mono)}
.stat.red .stat-val{color:var(--red2)}
.stat.grn .stat-val{color:var(--grn)}
.stat.gld .stat-val{color:var(--gld)}
.stat.wht .stat-val{color:var(--t0)}

/* ─────────────────────────────────
   FORM ELEMENTS
───────────────────────────────── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg.full{grid-column:1/-1}
.fg.span3{grid-column:1/-1}
.lbl{
  font-size:11px;font-weight:600;
  color:var(--t1);letter-spacing:.04em;
  text-transform:uppercase;
}
.lbl-req{color:var(--red2);margin-left:2px}
input,select,textarea{
  background:var(--s2);
  border:1px solid var(--b1);
  border-radius:var(--r6);
  color:var(--t0);
  font-family:var(--sans);
  font-size:13.5px;
  padding:9px 12px;
  width:100%;outline:none;
  transition:border-color .15s var(--ease),box-shadow .15s var(--ease),background .15s var(--ease);
  -webkit-appearance:none;
}
input:hover,select:hover{border-color:var(--b2);background:var(--s3)}
input:focus,select:focus,textarea:focus{
  border-color:var(--red);
  box-shadow:0 0 0 3px var(--red-dim);
  background:var(--s2);
}
input::placeholder,textarea::placeholder{color:var(--t2)}
input:disabled{opacity:.3;cursor:not-allowed;background:var(--s1)}
textarea{resize:vertical;min-height:76px;line-height:1.6}
textarea.req-field{min-height:90px}
select{cursor:pointer}
select option{background:var(--s2)}
input[type=file]{display:none}

/* ── DIRECTION TOGGLE ── */
.dir-toggle{display:flex;gap:6px}
.dir-btn{
  flex:1;padding:9px 0;text-align:center;
  border-radius:var(--r6);border:1px solid var(--b1);
  background:var(--s2);color:var(--t1);
  cursor:pointer;font-family:var(--sans);font-size:13px;font-weight:700;
  letter-spacing:.02em;
  transition:all .15s var(--ease);
}
.dir-btn:hover{border-color:var(--b2);color:var(--t0);background:var(--s3)}
.dir-btn.long.act{
  background:var(--grn-mid);color:var(--grn);
  border-color:var(--grn-border);
  box-shadow:0 0 10px var(--grn-dim);
}
.dir-btn.short.act{
  background:var(--red-mid);color:var(--red2);
  border-color:var(--red-border);
  box-shadow:0 0 10px var(--red-dim);
}

/* ── PNL / RR DISPLAY ── */
.pnl-box{
  padding:9px 12px;border-radius:var(--r6);
  border:1px solid var(--b1);background:var(--s2);
  font-family:var(--mono);font-size:17px;font-weight:600;
  text-align:center;color:var(--t2);
  transition:all .2s var(--ease);
}
.pnl-box.profit{background:var(--grn-dim);border-color:var(--grn-border);color:var(--grn)}
.pnl-box.loss{background:var(--red-dim);border-color:var(--red-border);color:var(--red2)}
.rr-box{
  padding:9px 12px;border-radius:var(--r6);
  border:1px solid var(--b1);background:var(--s2);
  font-family:var(--mono);font-size:14px;font-weight:600;
  text-align:center;color:var(--t2);
  transition:all .2s var(--ease);
}
.rr-box.poor{background:var(--red-dim);border-color:var(--red-border);color:var(--red2)}
.rr-box.decent{background:var(--gld-dim);border-color:var(--gld-border);color:var(--gld)}
.rr-box.strong{background:var(--grn-dim);border-color:var(--grn-border);color:var(--grn)}

/* ── FILE DROP ── */
.file-drop{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:var(--r6);
  border:1px dashed var(--b1);background:var(--s2);
  color:var(--t2);cursor:pointer;font-size:13px;font-weight:500;
  transition:all .15s var(--ease);
}
.file-drop:hover{border-color:var(--red);color:var(--red2);background:var(--red-dim)}

/* ─────────────────────────────────
   BUTTONS
───────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 14px;border-radius:var(--r6);
  border:1px solid var(--b1);background:var(--s2);
  color:var(--t0);font-family:var(--sans);
  font-size:13px;font-weight:600;cursor:pointer;
  transition:all .15s var(--ease);white-space:nowrap;
  letter-spacing:.01em;
}
.btn:hover{background:var(--s4);border-color:var(--b2)}
.btn:active{transform:scale(.97)}
.btn i{font-size:15px}
.btn-red{
  background:linear-gradient(135deg,var(--red),#a01818);
  border-color:var(--red);color:#fff;
  box-shadow:0 0 16px var(--red-glow);
}
.btn-red:hover{box-shadow:0 0 24px var(--red-glow);filter:brightness(1.1)}
.btn-red:disabled,.btn-approve:disabled{
  opacity:.3;cursor:not-allowed;pointer-events:none;
  box-shadow:none;filter:none;
}
.btn-approve{
  background:var(--grn-mid);color:var(--grn);
  border-color:var(--grn-border);
}
.btn-approve:hover{background:rgba(30,186,108,.25)}
.btn-danger{
  background:var(--red-dim);color:var(--red2);
  border-color:var(--red-border);
}
.btn-danger:hover{background:var(--red-mid)}
.btn-ghost{
  background:transparent;color:var(--t1);border-color:transparent;
}
.btn-ghost:hover{background:var(--s3);color:var(--t0);border-color:var(--b1)}
.btn-sm{padding:5px 10px;font-size:11px;gap:5px}
.btn-sm i{font-size:13px}

/* ─────────────────────────────────
   CHIPS (for status)
───────────────────────────────── */
.chip{
  display:inline-flex;align-items:center;padding:3px 9px;
  border-radius:20px;font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;
}
.ch-long{background:var(--grn-dim);color:var(--grn);border:1px solid var(--grn-border)}
.ch-short{background:var(--red-dim);color:var(--red2);border:1px solid var(--red-border)}
.ch-gld{background:var(--gld-dim);color:var(--gld);border:1px solid var(--gld-border)}
.ch-muted{background:var(--s3);color:var(--t1);border:1px solid var(--b1)}
.ch-red{background:var(--red-dim);color:var(--red2);border:1px solid var(--red-border)}

/* ─────────────────────────────────
   SELECT PILLS — mistakes, emotions, actions
   Premium interactive chips with glow states
───────────────────────────────── */
.pill-grid{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:4px}
.pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:7px 13px;border-radius:20px;
  border:1px solid var(--b1);background:var(--s2);
  cursor:pointer;font-size:12px;font-weight:600;
  color:var(--t1);
  transition:
    background .2s var(--ease),
    border-color .2s var(--ease),
    color .2s var(--ease),
    box-shadow .2s var(--ease),
    transform .1s var(--ease);
  user-select:none;
  letter-spacing:.01em;
}
.pill:hover{
  border-color:var(--b2);color:var(--t0);
  background:var(--s3);transform:translateY(-1px);
}
.pill input{display:none}
/* mistake pills → red glow when checked */
.pill.p-mistake.on{
  background:var(--red-mid);color:var(--red2);
  border-color:var(--red-border);
  box-shadow:0 0 12px var(--red-dim),inset 0 0 8px var(--red-dim);
  transform:translateY(-1px);
}
/* improvement pills → gold glow */
.pill.p-action.on{
  background:var(--gld-mid);color:var(--gld);
  border-color:var(--gld-border);
  box-shadow:0 0 12px var(--gld-dim),inset 0 0 8px var(--gld-dim);
  transform:translateY(-1px);
}
/* emotion pills — per-emotion tint */
.pill.p-emo.on{
  background:rgba(167,139,250,.15);color:#c4b5fd;
  border-color:rgba(167,139,250,.4);
  box-shadow:0 0 12px rgba(167,139,250,.15);
  transform:translateY(-1px);
}

/* ─────────────────────────────────
   RETAKE BUTTONS
───────────────────────────────── */
.retake-row{display:flex;gap:6px}
.retake-btn{
  flex:1;padding:9px;text-align:center;
  border-radius:var(--r6);border:1px solid var(--b1);
  background:var(--s2);color:var(--t1);
  cursor:pointer;font-family:var(--sans);font-size:13px;font-weight:700;
  transition:all .15s var(--ease);
}
.retake-btn:hover{border-color:var(--b2);color:var(--t0);background:var(--s3)}
.retake-btn.sel-yes{background:var(--grn-mid);color:var(--grn);border-color:var(--grn-border);box-shadow:0 0 10px var(--grn-dim)}
.retake-btn.sel-no{background:var(--red-mid);color:var(--red2);border-color:var(--red-border);box-shadow:0 0 10px var(--red-dim)}
.retake-btn.sel-maybe{background:var(--gld-mid);color:var(--gld);border-color:var(--gld-border);box-shadow:0 0 10px var(--gld-dim)}

/* ─────────────────────────────────
   TRADE CARD
───────────────────────────────── */
.trade-card{
  background:var(--s1);border:1px solid var(--b0);
  border-radius:var(--r12);padding:14px 16px;
  margin-bottom:8px;
  transition:border-color .15s,background .15s;
  animation:fadeUp .18s var(--ease) both;
}
.trade-card:hover{border-color:var(--b1);background:var(--s2)}
.tc-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.tc-l{display:flex;align-items:center;gap:10px}
.tc-ico{
  width:36px;height:36px;border-radius:var(--r8);
  display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;
}
.tc-ico.long{background:var(--grn-dim);color:var(--grn)}
.tc-ico.short{background:var(--red-dim);color:var(--red2)}
.tc-asset{font-size:13px;font-weight:700;font-family:var(--mono);color:var(--t0);letter-spacing:.03em}
.tc-time{font-size:11px;color:var(--t2);margin-top:1px;font-family:var(--mono)}
.tc-pnl{font-size:19px;font-weight:700;font-family:var(--mono);letter-spacing:-.03em;line-height:1}
.tc-pnl.profit{color:var(--grn)}
.tc-pnl.loss{color:var(--red2)}
.tc-pnl.neutral{color:var(--t2)}
.tc-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.meta-sep{color:var(--t2);font-size:11px}
.meta-val{font-size:12px;color:var(--t1);font-family:var(--mono)}

/* ─────────────────────────────────
   REVIEW PANEL
───────────────────────────────── */
.rev-panel{
  margin-top:14px;border-top:1px solid var(--b0);padding-top:18px;
}
.rev-step{
  background:var(--s2);border:1px solid var(--b0);
  border-radius:var(--r8);padding:14px 16px;margin-bottom:10px;
}
.rev-step-ttl{
  font-size:11px;font-weight:700;
  color:var(--t1);text-transform:uppercase;letter-spacing:.08em;
  margin-bottom:10px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.rev-step-ttl span{display:flex;align-items:center;gap:6px}
.step-req{
  font-size:9px;color:var(--red2);
  font-family:var(--mono);letter-spacing:.06em;
  background:var(--red-dim);padding:2px 6px;border-radius:20px;
  border:1px solid var(--red-border);
}
.step-ok{
  font-size:9px;color:var(--grn);
  font-family:var(--mono);letter-spacing:.06em;
  background:var(--grn-dim);padding:2px 6px;border-radius:20px;
  border:1px solid var(--grn-border);
}
.rev-actions{
  display:flex;gap:8px;justify-content:space-between;
  align-items:center;
  margin-top:14px;padding-top:14px;
  border-top:1px solid var(--b0);
}
.rev-validation{
  font-size:11px;color:var(--t2);
  display:flex;align-items:center;gap:6px;
  font-family:var(--mono);
}
.rev-validation.ready{color:var(--grn)}
/* RR quality hint */
.rr-quality{
  font-size:10px;font-family:var(--mono);font-weight:600;
  padding:2px 8px;border-radius:20px;
}
.rr-q-poor{background:var(--red-dim);color:var(--red2);border:1px solid var(--red-border)}
.rr-q-decent{background:var(--gld-dim);color:var(--gld);border:1px solid var(--gld-border)}
.rr-q-strong{background:var(--grn-dim);color:var(--grn);border:1px solid var(--grn-border)}

/* ─────────────────────────────────
   EXPAND BUTTON
───────────────────────────────── */
.expand-btn{
  background:none;border:none;color:var(--t2);
  cursor:pointer;font-family:var(--sans);font-size:12px;
  padding:5px 8px;border-radius:var(--r4);
  display:flex;align-items:center;gap:4px;
  transition:all .15s var(--ease);font-weight:600;
}
.expand-btn:hover{background:var(--s3);color:var(--t0)}

/* ─────────────────────────────────
   BARS
───────────────────────────────── */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-lbl{font-size:12px;color:var(--t1);min-width:148px;max-width:148px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:4px;background:var(--s3);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;background:var(--red);transition:width .5s var(--ease)}
.bar-fill.grn{background:var(--grn)}
.bar-count{font-size:11px;color:var(--t2);font-family:var(--mono);min-width:22px;text-align:right}

/* ─────────────────────────────────
   TABLE
───────────────────────────────── */
.tbl{width:100%;border-collapse:collapse}
.tbl th{
  text-align:left;padding:10px 14px;
  font-size:10px;font-weight:700;color:var(--t2);
  text-transform:uppercase;letter-spacing:.08em;
  border-bottom:1px solid var(--b0);
}
.tbl td{padding:11px 14px;font-size:12.5px;border-bottom:1px solid var(--b0)}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover td{background:var(--s2)}

/* ─────────────────────────────────
   SECTION HEADER / MISC
───────────────────────────────── */
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-ttl{font-size:14px;font-weight:700;color:var(--t0);letter-spacing:-.01em}

.alert{
  display:flex;align-items:flex-start;gap:10px;
  padding:12px 14px;border-radius:var(--r8);font-size:13px;margin-bottom:16px;
}
.alert i{font-size:16px;margin-top:1px;flex-shrink:0}
.alert-warn{background:rgba(212,168,23,.08);color:var(--gld);border:1px solid var(--gld-border)}
.alert-info{background:var(--red-dim);color:var(--t1);border:1px solid var(--b1)}

.empty{
  text-align:center;padding:52px 20px;
  display:flex;flex-direction:column;align-items:center;gap:12px;
}
.empty-ico{
  width:56px;height:56px;border-radius:var(--r16);
  background:var(--s2);display:flex;align-items:center;justify-content:center;
  font-size:24px;color:var(--t2);
}
.empty h3{font-size:14px;font-weight:700;color:var(--t0)}
.empty p{font-size:12px;color:var(--t1);max-width:280px;line-height:1.6}

.divider{height:1px;background:var(--b0);margin:14px 0}
.row{display:flex;gap:12px}
.col{flex:1;min-width:0}

.section-lbl{
  font-size:10px;font-weight:700;color:var(--t2);
  text-transform:uppercase;letter-spacing:.08em;
  margin:20px 0 10px;display:flex;align-items:center;gap:6px;
}

/* ── SETTINGS TAG EDITOR ── */
.tag-editor{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tag-item{
  display:flex;align-items:center;gap:6px;
  padding:5px 10px 5px 12px;border-radius:20px;
  border:1px solid var(--b1);background:var(--s2);
  font-size:12px;color:var(--t0);
}
.tag-item button{
  background:none;border:none;color:var(--t2);
  cursor:pointer;font-size:15px;line-height:1;
  display:flex;align-items:center;
  transition:color .12s;font-family:var(--sans);padding:0;
}
.tag-item button:hover{color:var(--red2)}
.add-row{display:flex;gap:8px}
.add-row input{flex:1}

.mistake-chip{
  padding:2px 8px;border-radius:20px;
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  background:var(--red-dim);color:var(--red2);
  border:1px solid var(--red-border);
}

/* ── RESPONSIVE ── */
@media(max-width:660px){
  :root{--sw:54px}
  .sb-name,.sb-sub,.nav-item span,.mkt-name,.mkt-live{display:none}
  .nav-item{justify-content:center;padding:10px}
  .nav-item i{margin:0}
  .form-grid{grid-template-columns:1fr}
  .stats-row{grid-template-columns:1fr 1fr}
  .row{flex-direction:column}
}
</style>
</head>
<body>

<!-- ── SIDEBAR ── -->
<aside class="sidebar">
  <div class="sb-brand">
    <div class="sb-logorow">
      <div class="sb-glyph"><i class="ti ti-chart-candle-filled" aria-hidden="true"></i></div>
      <div>
        <div class="sb-name">TradeLog</div>
        <div class="sb-sub">MNQ JOURNAL</div>
      </div>
    </div>
  </div>
  <nav class="sb-nav" id="sidebar-nav"></nav>
  <div class="sb-foot">
    <div class="mkt-pill">
      <div class="mkt-dot"></div>
      <span class="mkt-name">MNQ</span>
      <span class="mkt-live">● LIVE</span>
    </div>
  </div>
</aside>

<!-- ── MAIN ── -->
<div class="main">
  <div class="topbar">
    <div>
      <div class="pg-title" id="page-title">Log Trade</div>
      <div class="pg-sub" id="page-sub">MNQ / MICRO NASDAQ FUTURES</div>
    </div>
    <div class="tb-right" id="tb-right"></div>
  </div>
  <div class="content" id="main-content"></div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════
//  STATE & PERSISTENCE
// ══════════════════════════════════════════════════════════════════
const DEFAULT_MISTAKES    = ['FOMO entry','Entered too early','Entered too late','Overtrading','Revenge trade','Risk too high','Ignored stop loss',"Didn't follow plan",'Emotional exit','No mistake / clean trade','Other'];
const DEFAULT_IMPROVEMENTS= ['Wait for confirmation','Stick to plan','Reduce position size','Avoid trading after loss','Improve timing','Other'];
const EMOTIONS            = ['FOMO','Revenge','Hesitant','Overconfident','Greedy','Calm','Tired','Bored'];
const SESSIONS            = ['London','NY Open','Lunch','Power Hour','Asia'];

function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}

let state={
  tab:'log',
  trades:   load('mnq_trades',[]),
  mistakes: load('mnq_mistakes',DEFAULT_MISTAKES),
  improvements:load('mnq_improvements',DEFAULT_IMPROVEMENTS),
  expandedReview:null,
  _draft:null,
};
function persist(){save('mnq_trades',state.trades);save('mnq_mistakes',state.mistakes);save('mnq_improvements',state.improvements)}

// ══════════════════════════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════════════════════════
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

function calcPnL(entry,exit,size,dir){
  if(!entry||!exit)return null;
  const e=parseFloat(entry),x=parseFloat(exit),s=parseFloat(size)||1;
  if(isNaN(e)||isNaN(x))return null;
  const ticks=(dir==='long')?(x-e)/0.25:(e-x)/0.25;
  return+(ticks*0.5*s).toFixed(2);
}

function calcRR(entry,sl,tp,dir){
  if(!entry||!sl||!tp)return null;
  const e=parseFloat(entry),s=parseFloat(sl),t=parseFloat(tp);
  if(isNaN(e)||isNaN(s)||isNaN(t))return null;
  const risk =(dir==='long')?(e-s):(s-e);
  const reward=(dir==='long')?(t-e):(e-t);
  if(risk<=0||reward<=0)return null;
  return{risk,reward,ratio:+(reward/risk).toFixed(2)};
}

function rrClass(ratio){
  if(!ratio)return'';
  if(ratio<1)return'poor';
  if(ratio<2)return'decent';
  return'strong';
}

function formatDate(ts){
  const d=new Date(ts);
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+' · '+d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
}
function formatWeekKey(k){
  const d=new Date(k+'T00:00:00');const sun=new Date(d);sun.setDate(d.getDate()+6);
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' – '+sun.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function formatMonthKey(k){
  const[y,m]=k.split('-');return new Date(+y,+m-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
}
function getApproved(){return state.trades.filter(t=>t.status==='approved')}
function getQueue(){return state.trades.filter(t=>t.status==='queued')}

// ══════════════════════════════════════════════════════════════════
//  NAV
// ══════════════════════════════════════════════════════════════════
const PAGES=[
  {id:'log',       icon:'ti-circle-plus',          label:'Log Trade'},
  {id:'queue',     icon:'ti-clock-hour-4',          label:'Review Queue'},
  {id:'analytics', icon:'ti-chart-bar',             label:'Analytics'},
  {id:'recap',     icon:'ti-calendar-stats',         label:'Recap'},
  {id:'settings',  icon:'ti-adjustments-horizontal', label:'Settings'},
];
const PAGE_META={
  log:      {title:'Log Trade',                sub:'MNQ / MICRO NASDAQ FUTURES'},
  queue:    {title:'Review Queue',             sub:'DEEP REVIEW REQUIRED BEFORE APPROVAL'},
  analytics:{title:'Analytics',               sub:'APPROVED TRADES ONLY'},
  recap:    {title:'Weekly & Monthly Recap',   sub:'PERFORMANCE OVER TIME'},
  settings: {title:'Settings',                sub:'CUSTOMISE YOUR JOURNAL'},
};

// ══════════════════════════════════════════════════════════════════
//  RENDER ORCHESTRATOR
// ══════════════════════════════════════════════════════════════════
function render(){
  const qc=getQueue().length;
  const meta=PAGE_META[state.tab];

  document.getElementById('sidebar-nav').innerHTML=PAGES.map(p=>`
    <button class="nav-item${state.tab===p.id?' act':''}" onclick="setTab('${p.id}')">
      <i class="ti ${p.icon}" aria-hidden="true"></i>
      <span>${p.label}</span>
      ${p.id==='queue'&&qc?`<span class="nav-badge">${qc}</span>`:''}
    </button>`).join('');

  document.getElementById('page-title').textContent=meta.title;
  document.getElementById('page-sub').textContent=meta.sub;

  const tr=document.getElementById('tb-right');
  if(state.tab==='analytics'||state.tab==='recap'){
    tr.innerHTML=`<span style="font-size:11px;color:var(--t2);font-family:var(--mono)">${getApproved().length} APPROVED</span>`;
  } else if(state.tab==='queue'){
    tr.innerHTML=qc
      ?`<span class="chip ch-red">${qc} PENDING</span>`
      :`<span class="chip ch-muted">CLEAR</span>`;
  } else tr.innerHTML='';

  const c=document.getElementById('main-content');
  if     (state.tab==='log')       c.innerHTML=renderLog();
  else if(state.tab==='queue')     c.innerHTML=renderQueue();
  else if(state.tab==='analytics') c.innerHTML=renderAnalytics();
  else if(state.tab==='recap')     c.innerHTML=renderRecap();
  else if(state.tab==='settings')  c.innerHTML=renderSettings();
}

function setTab(t){state.tab=t;state.expandedReview=null;render()}

// ══════════════════════════════════════════════════════════════════
//  LOG TRADE
// ══════════════════════════════════════════════════════════════════
let logForm={direction:'long',entry:'',exit:'',size:'',sl:'',tp:'',session:'',notes:''};
let pendingScreenshot=null;

function renderLog(){
  const pnl=calcPnL(logForm.entry,logForm.exit,logForm.size,logForm.direction);
  const pc=pnl===null?'':(pnl>=0?' profit':' loss');
  const pt=pnl===null?'—':(pnl>=0?'+':'')+pnl.toFixed(2);
  const rr=calcRR(logForm.entry,logForm.sl,logForm.tp,logForm.direction);
  const rrCls=rr?rrClass(rr.ratio):'';
  const rrTxt=rr?`Risk ${rr.risk.toFixed(2)} / Reward ${rr.reward.toFixed(2)} = 1:${rr.ratio}`:'Enter SL & TP';
  const recent=state.trades.filter(t=>t.status==='approved').slice(0,5);

  return`
  <div class="card">
    <div class="card-hd">
      <div class="card-hd-l">
        <div class="card-ico ico-red"><i class="ti ti-circle-plus" aria-hidden="true"></i></div>
        <div><div class="card-ttl">New Trade Entry</div><div class="card-stl">Added to Review Queue · does not affect stats until approved</div></div>
      </div>
    </div>
    <div class="card-bd">
      <div class="form-grid">
        <div class="fg">
          <label class="lbl">Asset</label>
          <input value="MNQ — Micro Nasdaq Futures" disabled>
        </div>
        <div class="fg">
          <label class="lbl">Session</label>
          <select id="lf-session" onchange="updateLogForm('session',this.value)">
            <option value="">Select session…</option>
            ${SESSIONS.map(s=>`<option value="${s}"${logForm.session===s?' selected':''}>${s}</option>`).join('')}
          </select>
        </div>
        <div class="fg">
          <label class="lbl">Direction</label>
          <div class="dir-toggle">
            <div class="dir-btn long${logForm.direction==='long'?' act':''}" onclick="setDir('long')">▲ Long</div>
            <div class="dir-btn short${logForm.direction==='short'?' act':''}" onclick="setDir('short')">▼ Short</div>
          </div>
        </div>
        <div class="fg">
          <label class="lbl">Position Size <span style="color:var(--t2)">(contracts)</span></label>
          <input type="number" step="1" min="1" id="lf-size" value="${logForm.size}" placeholder="e.g. 2" oninput="updateLogForm('size',this.value)">
        </div>
        <div class="fg">
          <label class="lbl">Entry Price</label>
          <input type="number" step="0.25" id="lf-entry" value="${logForm.entry}" placeholder="e.g. 21050.00" oninput="updateLogForm('entry',this.value)">
        </div>
        <div class="fg">
          <label class="lbl">Exit Price</label>
          <input type="number" step="0.25" id="lf-exit" value="${logForm.exit}" placeholder="e.g. 21110.00" oninput="updateLogForm('exit',this.value)">
        </div>
        <div class="fg">
          <label class="lbl">Stop Loss (SL)</label>
          <input type="number" step="0.25" id="lf-sl" value="${logForm.sl}" placeholder="e.g. 21030.00" oninput="updateLogForm('sl',this.value)">
        </div>
        <div class="fg">
          <label class="lbl">Take Profit (TP)</label>
          <input type="number" step="0.25" id="lf-tp" value="${logForm.tp}" placeholder="e.g. 21110.00" oninput="updateLogForm('tp',this.value)">
        </div>
        <div class="fg">
          <label class="lbl">P&L (Auto)</label>
          <div class="pnl-box${pc}">${pt}</div>
        </div>
        <div class="fg">
          <label class="lbl">Planned RR</label>
          <div class="rr-box${rrCls?` ${rrCls}`:''}">
            ${rr?`1:${rr.ratio}`:rrTxt}
          </div>
        </div>
        <div class="fg full">
          <label class="lbl">Screenshot <span style="color:var(--t2)">(optional)</span></label>
          <label class="file-drop" for="lf-screenshot">
            <i class="ti ti-photo" aria-hidden="true"></i>
            <span id="file-label">Attach chart screenshot…</span>
          </label>
          <input type="file" id="lf-screenshot" accept="image/*" onchange="handleFile(this)">
        </div>
        <div class="fg full">
          <label class="lbl">Notes <span style="color:var(--t2)">(optional)</span></label>
          <textarea id="lf-notes" placeholder="Setup description, market context, thoughts…" oninput="updateLogForm('notes',this.value)">${logForm.notes}</textarea>
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:18px;padding-top:16px;border-top:1px solid var(--b0)">
        <button class="btn btn-red" onclick="submitTrade()">
          <i class="ti ti-arrow-right" aria-hidden="true"></i>
          Add to Review Queue
        </button>
      </div>
    </div>
  </div>
  ${recent.length?`
  <div class="section-lbl"><i class="ti ti-history" aria-hidden="true"></i> Recent Approved</div>
  ${recent.map(renderTradeCard).join('')}`:''}`;
}

function handleFile(input){
  const f=input.files[0];if(!f)return;
  document.getElementById('file-label').textContent=f.name;
  const r=new FileReader();r.onload=e=>{pendingScreenshot=e.target.result};r.readAsDataURL(f);
}
function updateLogForm(k,v){logForm[k]=v;rerenderCalc()}
function setDir(d){
  logForm.direction=d;
  document.querySelectorAll('.dir-btn').forEach(b=>{b.classList.toggle('act',b.classList.contains(d))});
  rerenderCalc();
}
function rerenderCalc(){
  const pnl=calcPnL(logForm.entry,logForm.exit,logForm.size,logForm.direction);
  const pb=document.querySelector('.pnl-box');
  if(pb){pb.className='pnl-box'+(pnl===null?'':(pnl>=0?' profit':' loss'));pb.textContent=pnl===null?'—':(pnl>=0?'+':'')+pnl.toFixed(2)}
  const rr=calcRR(logForm.entry,logForm.sl,logForm.tp,logForm.direction);
  const rb=document.querySelector('.rr-box');
  if(rb){
    const cls=rr?rrClass(rr.ratio):'';
    rb.className='rr-box'+(cls?` ${cls}`:'');
    rb.textContent=rr?`1:${rr.ratio}`:'Enter SL & TP';
  }
}
function submitTrade(){
  const entry=parseFloat(logForm.entry),exit=parseFloat(logForm.exit);
  if(isNaN(entry)||isNaN(exit)){alert('Please enter entry and exit prices.');return}
  const pnl=calcPnL(logForm.entry,logForm.exit,logForm.size,logForm.direction);
  const rrData=calcRR(logForm.entry,logForm.sl,logForm.tp,logForm.direction);
  state.trades.unshift({
    id:uid(),ts:Date.now(),asset:'MNQ',
    direction:logForm.direction,entry,exit,
    size:parseFloat(logForm.size)||1,
    sl:parseFloat(logForm.sl)||null,
    tp:parseFloat(logForm.tp)||null,
    plannedRR:rrData?rrData.ratio:null,
    pnl,notes:logForm.notes.trim(),
    session:logForm.session,
    screenshot:pendingScreenshot,
    status:'queued',review:null
  });
  persist();
  logForm={direction:'long',entry:'',exit:'',size:'',sl:'',tp:'',session:'',notes:''};
  pendingScreenshot=null;
  render();
}

// ══════════════════════════════════════════════════════════════════
//  TRADE CARD (shared renderer)
// ══════════════════════════════════════════════════════════════════
function renderTradeCard(t){
  const pnlTxt=t.pnl!=null?(t.pnl>=0?'+':'')+t.pnl.toFixed(2):'—';
  const pnlCls=t.pnl!=null?(t.pnl>0?'profit':'loss'):'neutral';
  const ico=t.direction==='long'?'ti-trending-up':'ti-trending-down';
  return`<div class="trade-card">
    <div class="tc-hd">
      <div class="tc-l">
        <div class="tc-ico ${t.direction}"><i class="ti ${ico}" aria-hidden="true"></i></div>
        <div>
          <div class="tc-asset">MNQ${t.session?` · ${t.session}`:''}</div>
          <div class="tc-time">${formatDate(t.ts)}</div>
        </div>
      </div>
      <div class="tc-pnl ${pnlCls}">${pnlTxt}</div>
    </div>
    <div class="tc-meta">
      <span class="chip ch-${t.direction}">${t.direction}</span>
      <span class="meta-val">${t.entry}</span><span class="meta-sep">→</span><span class="meta-val">${t.exit}</span>
      <span class="meta-sep">·</span><span class="meta-val">${t.size}c</span>
      ${t.plannedRR?`<span class="meta-sep">·</span><span class="rr-quality rr-q-${rrClass(t.plannedRR)}">1:${t.plannedRR} RR</span>`:''}
      ${t.notes?`<span class="meta-sep">·</span><span style="font-size:11px;color:var(--t2);font-family:var(--sans)">${t.notes.slice(0,50)}${t.notes.length>50?'…':''}</span>`:''}
    </div>
  </div>`;
}

// ══════════════════════════════════════════════════════════════════
//  REVIEW QUEUE
// ══════════════════════════════════════════════════════════════════
function renderQueue(){
  const queue=getQueue();
  if(!queue.length)return`<div class="empty">
    <div class="empty-ico"><i class="ti ti-checks" aria-hidden="true"></i></div>
    <h3>Review queue is clear</h3>
    <p>All trades reviewed. Log new trades to continue tracking your discipline.</p>
  </div>`;
  return`
  <div class="alert alert-warn">
    <i class="ti ti-alert-triangle" aria-hidden="true"></i>
    Deep review required before trades count toward your stats. All fields marked <span style="color:var(--red2);font-weight:700">REQUIRED</span> must be completed to approve.
  </div>
  <div class="sec-hd">
    <span class="sec-ttl">Pending Review <span style="color:var(--red2);font-family:var(--mono)">(${queue.length})</span></span>
  </div>
  ${queue.map(renderQueueItem).join('')}`;
}

function renderQueueItem(t){
  const expanded=state.expandedReview===t.id;
  const pnlTxt=t.pnl!=null?(t.pnl>=0?'+':'')+t.pnl.toFixed(2):'—';
  const pnlCls=t.pnl!=null?(t.pnl>0?'profit':'loss'):'neutral';
  const ico=t.direction==='long'?'ti-trending-up':'ti-trending-down';
  const rev=state._draft&&state._draft.id===t.id
    ?state._draft
    :{mistakes:[],improvements:[],retake:'',emotions:[],problem:'',shouldhave:'',warning:''};

  const {valid,missing}=validateDraft(rev);

  return`<div class="trade-card" id="qi-${t.id}">
    <div class="tc-hd">
      <div class="tc-l">
        <div class="tc-ico ${t.direction}"><i class="ti ${ico}" aria-hidden="true"></i></div>
        <div>
          <div class="tc-asset">MNQ${t.session?` · ${t.session}`:''}</div>
          <div class="tc-time">${formatDate(t.ts)}</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">

          <span><i class="ti ti-bulb" style="color:var(--gld)" aria-hidden="true"></i> Improvement Actions</span>

          <label class="pill p-action${rev.improvements.includes(m)?' on':''}" onclick="toggleImprovement('${t.id}','${m.replace(/'/g,"\\'")}',this)">

        <div style="display:flex;flex-direction:column;gap:10px">

function validateDraft(rev){
  const issues=[];
  if(!rev.mistakes.length) issues.push('select a mistake');
  if(!rev.improvements.length) issues.push('select an action');
  if(!rev.problem||rev.problem.trim().length<10) issues.push('describe the problem (10+ chars)');
  if(!rev.shouldhave||rev.shouldhave.trim().length<10) issues.push('describe what to do instead');
  if(!rev.warning||rev.warning.trim().length<10) issues.push('describe warning signs');
  if(!rev.retake) issues.push('answer retake question');
  return{valid:issues.length===0,missing:issues[0]||''};
}

function ensureDraft(tid){
  if(!state._draft||state._draft.id!==tid){
    state._draft={id:tid,mistakes:[],improvements:[],retake:'',emotions:[],problem:'',shouldhave:'',warning:''};
  }
}
function toggleReview(id){
  state.expandedReview=state.expandedReview===id?null:id;
  if(state.expandedReview===id) ensureDraft(id);
  render();
}
function toggleMistake(tid,m,el){
  ensureDraft(tid);
  const i=state._draft.mistakes.indexOf(m);
  if(i>=0)state._draft.mistakes.splice(i,1);else state._draft.mistakes.push(m);
  el.classList.toggle('on');
  updateApproveBtn(tid);
}
function toggleImprovement(tid,m,el){
  ensureDraft(tid);
  const i=state._draft.improvements.indexOf(m);
  if(i>=0)state._draft.improvements.splice(i,1);else state._draft.improvements.push(m);
  el.classList.toggle('on');
  updateApproveBtn(tid);
}
function toggleEmotion(tid,e,el){
  ensureDraft(tid);
  const i=state._draft.emotions.indexOf(e);
  if(i>=0)state._draft.emotions.splice(i,1);else state._draft.emotions.push(e);
  el.classList.toggle('on');
}
function setRetake(tid,val){
  ensureDraft(tid);
  state._draft.retake=val;
  document.querySelectorAll('.retake-btn').forEach(b=>{
    b.className='retake-btn';
    if(b.textContent.trim().toLowerCase()===val)b.classList.add('sel-'+val);
  });
  updateApproveBtn(tid);
}
function updateDraftField(tid,field,val){
  ensureDraft(tid);
  state._draft[field]=val;
  updateApproveBtn(tid);
}
function updateApproveBtn(tid){
  /* live update approve button & validation text without full re-render */
  if(!state._draft||state._draft.id!==tid)return;
  const {valid,missing}=validateDraft(state._draft);
  const btn=document.querySelector('.btn-approve');
  if(btn)btn.disabled=!valid;
  const vd=document.querySelector('.rev-validation');
  if(vd){
    vd.className='rev-validation'+(valid?' ready':'');
    vd.innerHTML=valid
      ?'<i class="ti ti-circle-check" aria-hidden="true"></i> Ready to approve'
      :`<i class="ti ti-lock" aria-hidden="true"></i> ${missing}`;
  }
}
function approveTrade(id){
  const trade=state.trades.find(t=>t.id===id);if(!trade)return;
  ensureDraft(id);
  const {valid}=validateDraft(state._draft);
  if(!valid){alert('Please complete all required review fields.');return}
  trade.status='approved';
  trade.review={
    mistakes:state._draft.mistakes,
    improvements:state._draft.improvements,
    retake:state._draft.retake,
    emotions:state._draft.emotions,
    problem:state._draft.problem,
    shouldhave:state._draft.shouldhave,
    warning:state._draft.warning
  };
  trade.approvedAt=Date.now();
  state._draft=null;state.expandedReview=null;
  persist();render();
}
function deleteTrade(id){
  if(!confirm('Delete this trade? This cannot be undone.'))return;
  state.trades=state.trades.filter(t=>t.id!==id);persist();render();
}

// ══════════════════════════════════════════════════════════════════
function renderAnalytics(){
  const trades=getApproved();
  if(!trades.length)return`<div class="empty">
    <div class="empty-ico"><i class="ti ti-chart-bar" aria-hidden="true"></i></div>
    <h3>No data yet</h3>
    <p>Approve trades in the Review Queue to see analytics.</p>
    <button class="btn" onclick="setTab('queue')"><i class="ti ti-arrow-right" aria-hidden="true"></i> Go to Queue</button>
  </div>`;

  const wins=trades.filter(t=>t.pnl>0);
  const losses=trades.filter(t=>t.pnl<=0);
  const wr=(wins.length/trades.length*100).toFixed(1);
  const totalPnL=trades.reduce((s,t)=>s+(t.pnl||0),0);
  const avgWin=wins.length?wins.reduce((s,t)=>s+t.pnl,0)/wins.length:0;
  const avgLoss=losses.length?Math.abs(losses.reduce((s,t)=>s+t.pnl,0)/losses.length):0;
  const actualRR=avgLoss>0?(avgWin/avgLoss).toFixed(2):'—';
  const plannedRRs=trades.filter(t=>t.plannedRR).map(t=>t.plannedRR);
  const avgPlannedRR=plannedRRs.length?(plannedRRs.reduce((a,b)=>a+b,0)/plannedRRs.length).toFixed(2):'—';

  /* mistake counts */
  const mCounts={};
  trades.forEach(t=>(t.review?.mistakes||[]).forEach(m=>{if(m!=='No mistake / clean trade')mCounts[m]=(mCounts[m]||0)+1}));
  const sortedM=Object.entries(mCounts).sort((a,b)=>b[1]-a[1]).slice(0,7);
  const maxM=sortedM[0]?.[1]||1;

  /* emotion counts */
  const eCounts={};
  trades.forEach(t=>(t.review?.emotions||[]).forEach(e=>{eCounts[e]=(eCounts[e]||0)+1}));
  const sortedE=Object.entries(eCounts).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxE=sortedE[0]?.[1]||1;

  /* session counts */
  const sCounts={};
  trades.forEach(t=>{if(t.session)sCounts[t.session]=(sCounts[t.session]||0)+1});

  const violations=trades.filter(t=>(t.review?.mistakes||[]).some(m=>m!=='No mistake / clean trade'&&m!=='Other')).length;
  const clean=trades.filter(t=>(t.review?.mistakes||[]).includes('No mistake / clean trade')).length;

  return`
  <div class="stats-row">
    <div class="stat wht"><div class="stat-lbl">Total Trades</div><div class="stat-val">${trades.length}</div></div>
    <div class="stat ${parseFloat(wr)>=50?'grn':'red'}"><div class="stat-lbl">Win Rate</div><div class="stat-val">${wr}%</div></div>
    <div class="stat ${totalPnL>=0?'grn':'red'}"><div class="stat-lbl">Total P&L</div><div class="stat-val">${totalPnL>=0?'+':''}${totalPnL.toFixed(2)}</div></div>
    <div class="stat gld"><div class="stat-lbl">Actual RR</div><div class="stat-val">${actualRR}</div></div>
    <div class="stat gld"><div class="stat-lbl">Planned RR</div><div class="stat-val">${avgPlannedRR}</div><div class="stat-sub">avg of ${plannedRRs.length} trades</div></div>
    <div class="stat red"><div class="stat-lbl">Violations</div><div class="stat-val">${violations}</div><div class="stat-sub">of ${trades.length} trades</div></div>
    <div class="stat grn"><div class="stat-lbl">Clean Trades</div><div class="stat-val">${clean}</div><div class="stat-sub">${trades.length?Math.round(clean/trades.length*100):0}% of total</div></div>
  </div>

  <div class="row" style="margin-bottom:12px">
    <div class="col">
      <div class="card">
        <div class="card-hd"><div class="card-hd-l"><div class="card-ico ico-red"><i class="ti ti-alert-circle" aria-hidden="true"></i></div><div class="card-ttl">Mistake Frequency</div></div></div>
        <div class="card-bd">
          ${sortedM.length?sortedM.map(([m,c])=>`
          <div class="bar-row">
            <div class="bar-lbl" title="${m}">${m}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${Math.round(c/maxM*100)}%"></div></div>
            <div class="bar-count">${c}</div>
          </div>`).join(''):`<div style="color:var(--t2);font-size:12px">No mistake data yet.</div>`}
        </div>
      </div>
    </div>
    <div class="col">
      <div class="card">
        <div class="card-hd"><div class="card-hd-l"><div class="card-ico ico-gld"><i class="ti ti-brain" aria-hidden="true"></i></div><div class="card-ttl">Emotional States</div></div></div>
        <div class="card-bd">
          ${sortedE.length?sortedE.map(([e,c])=>`
          <div class="bar-row">
            <div class="bar-lbl">${e}</div>
            <div class="bar-track"><div class="bar-fill grn" style="width:${Math.round(c/maxE*100)}%"></div></div>
            <div class="bar-count">${c}</div>
          </div>`).join(''):`<div style="color:var(--t2);font-size:12px">No emotion data yet.</div>`}
        </div>
      </div>
    </div>
  </div>

  <div class="row" style="margin-bottom:12px">
    <div class="col">
      <div class="card">
        <div class="card-hd"><div class="card-hd-l"><div class="card-ico ico-wht"><i class="ti ti-repeat" aria-hidden="true"></i></div><div class="card-ttl">Retake Distribution</div></div></div>
        <div class="card-bd">
          ${['yes','no','maybe'].map(r=>{
            const cnt=trades.filter(t=>t.review?.retake===r).length;
            const pct=trades.length?Math.round(cnt/trades.length*100):0;
            const cl=r==='yes'?'var(--grn)':r==='no'?'var(--red2)':'var(--gld)';
            return`<div class="bar-row">
              <div class="bar-lbl" style="color:${cl};text-transform:capitalize">${r}</div>
              <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${cl}"></div></div>
              <div class="bar-count">${cnt}</div>
            </div>`;
          }).join('')}
          <div class="divider" style="margin:10px 0"></div>
          <div style="display:flex;gap:16px;font-size:11px;color:var(--t1);font-family:var(--mono)">
            <span>Avg win <span style="color:var(--grn)">+${avgWin.toFixed(2)}</span></span>
            <span>Avg loss <span style="color:var(--red2)">-${avgLoss.toFixed(2)}</span></span>
          </div>
        </div>
      </div>
    </div>
    <div class="col">
      <div class="card">
        <div class="card-hd"><div class="card-hd-l"><div class="card-ico ico-wht"><i class="ti ti-clock" aria-hidden="true"></i></div><div class="card-ttl">Sessions</div></div></div>
        <div class="card-bd">
          ${Object.keys(sCounts).length?SESSIONS.filter(s=>sCounts[s]).map(s=>{
            const c=sCounts[s]||0;const pct=Math.round(c/trades.length*100);
            return`<div class="bar-row">
              <div class="bar-lbl">${s}</div>
              <div class="bar-track"><div class="bar-fill grn" style="width:${pct}%"></div></div>
              <div class="bar-count">${c}</div>
            </div>`;
          }).join(''):`<div style="color:var(--t2);font-size:12px">No session data yet — select session when logging.</div>`}
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-hd"><div class="card-hd-l"><div class="card-ico ico-wht"><i class="ti ti-list-details" aria-hidden="true"></i></div><div class="card-ttl">All Approved Trades</div></div></div>
    <div class="card-bd" style="padding:0">
      <table class="tbl">
        <thead><tr><th>Date</th><th>Dir</th><th>Entry</th><th>Exit</th><th>Sz</th><th>P&L</th><th>RR</th><th>Mistakes</th></tr></thead>
        <tbody>${trades.map(t=>{
          const p=t.pnl!=null?(t.pnl>=0?'+':'')+t.pnl.toFixed(2):'—';
          const pc=t.pnl>0?'var(--grn)':t.pnl<0?'var(--red2)':'var(--t2)';
          const ms=(t.review?.mistakes||[]).filter(m=>m!=='No mistake / clean trade').slice(0,2);
          return`<tr>
            <td style="color:var(--t2);font-size:11px;font-family:var(--mono)">${new Date(t.ts).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</td>
            <td><span class="chip ch-${t.direction}">${t.direction}</span></td>
            <td style="font-family:var(--mono)">${t.entry}</td>
            <td style="font-family:var(--mono)">${t.exit}</td>
            <td style="font-family:var(--mono)">${t.size}c</td>
            <td style="font-family:var(--mono);font-weight:700;color:${pc}">${p}</td>
            <td>${t.plannedRR?`<span class="rr-quality rr-q-${rrClass(t.plannedRR)}">1:${t.plannedRR}</span>`:'<span style="color:var(--t2)">—</span>'}</td>
            <td>${ms.map(m=>`<span class="mistake-chip">${m}</span>`).join(' ')||'<span style="color:var(--t2);font-size:11px">—</span>'}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    </div>
  </div>`;
}

// ══════════════════════════════════════════════════════════════════
//  RECAP
// ══════════════════════════════════════════════════════════════════
function renderRecap(){
  const trades=getApproved();
  if(!trades.length)return`<div class="empty">
    <div class="empty-ico"><i class="ti ti-calendar" aria-hidden="true"></i></div>
    <h3>No recap data</h3><p>Approve trades to see summaries.</p>
  </div>`;

  function groupBy(fn){const m={};trades.forEach(t=>{const k=fn(t);if(!m[k])m[k]=[];m[k].push(t)});return m}
  function weekKey(t){const d=new Date(t.ts);const mon=new Date(d);mon.setDate(d.getDate()-d.getDay()+1);return mon.toISOString().slice(0,10)}
  function monthKey(t){const d=new Date(t.ts);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
  function summarize(g){
    const wins=g.filter(t=>t.pnl>0);
    const pnl=g.reduce((s,t)=>s+(t.pnl||0),0);
    const mc={};g.forEach(t=>(t.review?.mistakes||[]).forEach(m=>{if(m!=='No mistake / clean trade')mc[m]=(mc[m]||0)+1}));
    const top=Object.entries(mc).sort((a,b)=>b[1]-a[1])[0]?.[0]||'—';
    return{count:g.length,wins:wins.length,pnl,topMistake:top};
  }
  function tbl(rows,keyFmt){
    return`<table class="tbl"><thead><tr>
      <th>Period</th><th>Trades</th><th>Win%</th><th>P&L</th><th>Top Mistake</th>
    </tr></thead><tbody>${rows.map(([k,g])=>{
      const s=summarize(g);const wr=Math.round(s.wins/s.count*100);
      return`<tr>
        <td style="font-size:12px;color:var(--t1);font-weight:600;font-family:var(--mono)">${keyFmt(k)}</td>
        <td style="font-family:var(--mono)">${s.count}</td>
        <td style="font-family:var(--mono);font-weight:700;color:${wr>=50?'var(--grn)':'var(--red2)'}">${wr}%</td>
        <td style="font-family:var(--mono);font-weight:700;color:${s.pnl>=0?'var(--grn)':'var(--red2)'}">${s.pnl>=0?'+':''}${s.pnl.toFixed(2)}</td>
        <td style="font-size:11px;color:var(--gld)">${s.topMistake.slice(0,32)}</td>
      </tr>`;
    }).join('')}</tbody></table>`;
  }
  const weeks =Object.entries(groupBy(weekKey)).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,8);
  const months=Object.entries(groupBy(monthKey)).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,6);

  return`
  <div class="card">
    <div class="card-hd"><div class="card-hd-l"><div class="card-ico ico-wht"><i class="ti ti-calendar-week" aria-hidden="true"></i></div><div class="card-ttl">Weekly Recap</div></div></div>
    <div class="card-bd" style="padding:0">${tbl(weeks,formatWeekKey)}</div>
  </div>
  <div class="card">
    <div class="card-hd"><div class="card-hd-l"><div class="card-ico ico-wht"><i class="ti ti-calendar-month" aria-hidden="true"></i></div><div class="card-ttl">Monthly Recap</div></div></div>
    <div class="card-bd" style="padding:0">${tbl(months,formatMonthKey)}</div>
  </div>`;
}

      <div><div class="card-ttl">Mistake List</div><div class="card-stl">Tags used during trade review</div></div></div></div>
    <div class="card-bd">
      <div class="tag-editor">${state.mistakes.map((m,i)=>`
        <div class="tag-item"><span>${m}</span><button onclick="removeMistake(${i})" title="Remove">×</button></div>`).join('')}</div>
      <div class="add-row">
        <input id="new-mistake" placeholder="Add new mistake type…" onkeydown="if(event.key==='Enter')addMistake()">
        <button class="btn" onclick="addMistake()"><i class="ti ti-plus" aria-hidden="true"></i> Add</button>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-hd"><div class="card-hd-l"><div class="card-ico ico-gld"><i class="ti ti-bulb" aria-hidden="true"></i></div>
      <div><div class="card-ttl">Improvement Actions</div><div class="card-stl">Fix actions shown during review</div></div></div></div>
    <div class="card-bd">
      <div class="tag-editor">${state.improvements.map((m,i)=>`
        <div class="tag-item"><span>${m}</span><button onclick="removeImprovement(${i})" title="Remove">×</button></div>`).join('')}</div>
      <div class="add-row">
        <input id="new-improvement" placeholder="Add new improvement action…" onkeydown="if(event.key==='Enter')addImprovement()">
        <button class="btn" onclick="addImprovement()"><i class="ti ti-plus" aria-hidden="true"></i> Add</button>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-hd"><div class="card-hd-l"><div class="card-ico ico-gld"><i class="ti ti-chart-candle" aria-hidden="true"></i></div>
      <div><div class="card-ttl">Default Market</div><div class="card-stl">Locked — no other instruments</div></div></div></div>
    <div class="card-bd"><input value="MNQ — Micro Nasdaq Futures" disabled></div>
  </div>
  <div class="card">
    <div class="card-hd"><div class="card-hd-l"><div class="card-ico ico-wht"><i class="ti ti-database" aria-hidden="true"></i></div>
      <div><div class="card-ttl">Data Management</div><div class="card-stl">${state.trades.length} trades · ${getApproved().length} approved · ${getQueue().length} queued</div></div></div></div>
    <div class="card-bd">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" onclick="exportJSON()"><i class="ti ti-download" aria-hidden="true"></i> Export JSON</button>
        <button class="btn" onclick="exportCSV()"><i class="ti ti-file-spreadsheet" aria-hidden="true"></i> Export CSV</button>
        <button class="btn btn-danger" onclick="clearAll()"><i class="ti ti-trash" aria-hidden="true"></i> Clear All Data</button>
      </div>
    </div>
  </div>`;
}

function addMistake(){const v=document.getElementById('new-mistake').value.trim();if(!v)return;state.mistakes.push(v);persist();render()}
function removeMistake(i){if(!confirm('Remove this mistake type?'))return;state.mistakes.splice(i,1);persist();render()}
function addImprovement(){const v=document.getElementById('new-improvement').value.trim();if(!v)return;state.improvements.push(v);persist();render()}
function removeImprovement(i){if(!confirm('Remove this action?'))return;state.improvements.splice(i,1);persist();render()}
function exportJSON(){
  const b=new Blob([JSON.stringify(state.trades,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='mnq-journal-'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
function exportCSV(){
  const h=['Date','Direction','Entry','Exit','Size','SL','TP','PlannedRR','PnL','Session','Status','Mistakes','Emotions','Retake','Problem','ShouldHave','Warning','Notes'];
  const rows=state.trades.map(t=>[
    new Date(t.ts).toISOString(),t.direction,t.entry,t.exit,t.size,
    t.sl||'',t.tp||'',t.plannedRR||'',t.pnl||'',t.session||'',t.status,
    (t.review?.mistakes||[]).join('; '),
    (t.review?.emotions||[]).join('; '),
    t.review?.retake||'',
    (t.review?.problem||'').replace(/,/g,' '),
    (t.review?.shouldhave||'').replace(/,/g,' '),
    (t.review?.warning||'').replace(/,/g,' '),
    (t.notes||'').replace(/,/g,' ')
  ]);
  const csv=[h,...rows].map(r=>r.join(',')).join('\n');
  const b=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='mnq-journal-'+new Date().toISOString().slice(0,10)+'.csv';a.click();
}
function clearAll(){
  if(!confirm('CLEAR ALL DATA? This will permanently delete all trades. This cannot be undone.'))return;
  if(!confirm('Are you absolutely sure? All trades will be lost.'))return;
  state.trades=[];persist();render();
}

// ══════════════════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════════════════
render();
</script>
</body>
</html>
